<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0ea5e9" />
<title>CompAct Jr. — Acompanhe os campeonatos</title>
<style>
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{
    --prim:#6366f1; --prim-esc:#4338ca; --prim-cla:#e0e7ff;
    --acen:#f472b6;
    --ok:#22c55e; --warn:#f59e0b; --err:#ef4444;
    --bg:#f8fafc; --bg-2:#ffffff; --bg-3:#f1f5f9;
    --txt:#0f172a; --txt-2:#475569; --txt-3:#94a3b8;
    --borda:#e2e8f0;
    --sombra:0 2px 8px rgba(15,23,42,.06);
    --sombra-forte:0 8px 24px rgba(15,23,42,.12);
    --r:16px; --r-sm:10px;
  }
    @media (prefers-color-scheme: dark){
    :root:not([data-tema="light"]){
      --bg:#0f172a; --bg-2:#1e293b; --bg-3:#0b1220;
      --txt:#f1f5f9; --txt-2:#cbd5e1; --txt-3:#94a3b8;
      --borda:#334155;
      --prim-cla:#312e81;
      --sombra:0 2px 8px rgba(0,0,0,.3);
      --sombra-forte:0 8px 24px rgba(0,0,0,.5);
    }
  }
  :root[data-tema="dark"]{
    --bg:#0f172a; --bg-2:#1e293b; --bg-3:#0b1220;
    --txt:#f1f5f9; --txt-2:#cbd5e1; --txt-3:#94a3b8;
    --borda:#334155;
    --prim-cla:#312e81;
    --sombra:0 2px 8px rgba(0,0,0,.3);
    --sombra-forte:0 8px 24px rgba(0,0,0,.5);
  }
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:var(--txt);
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
    min-height:100vh;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  /* Header */
  .hdr{
    position:sticky;top:0;z-index:50;
    background:var(--bg-2);
    border-bottom:1px solid var(--borda);
    padding:14px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    backdrop-filter:blur(10px);
    background:color-mix(in srgb, var(--bg-2) 85%, transparent);
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.3px}
  .brand-icon{
    width:32px;height:32px;border-radius:9px;
    background:linear-gradient(135deg,var(--prim),var(--acen));
    display:grid;place-items:center;color:#fff;font-size:16px;
  }
  .brand-sub{font-size:11px;color:var(--txt-3);font-weight:500;display:block;margin-top:1px}

  /* Container */
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}

  /* Hero */
  .hero{margin-bottom:24px;padding:24px 4px}
  .hero h1{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.15}
  .hero p{margin:0;color:var(--txt-2);font-size:14.5px}

  /* Grid de orgs */
  .grid{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:520px){.grid{grid-template-columns:1fr 1fr}}
  .org-card{
    background:var(--bg-2);border:1px solid var(--borda);border-radius:var(--r);
    padding:18px;display:flex;align-items:center;gap:14px;
    box-shadow:var(--sombra);
    transition:transform .15s, box-shadow .15s, border-color .15s;
    text-align:left;width:100%;
  }
  .org-card:active{transform:scale(.98)}
  @media(hover:hover){.org-card:hover{box-shadow:var(--sombra-forte);border-color:var(--prim)}}
  .org-emoji{
    width:52px;height:52px;border-radius:14px;
    display:grid;place-items:center;font-size:26px;
    background:linear-gradient(135deg, var(--org-cor, var(--prim)), color-mix(in srgb, var(--org-cor, var(--prim)) 60%, black));
    flex-shrink:0;
  }
  .org-info{flex:1;min-width:0}
  .org-nome{font-weight:700;font-size:16.5px;letter-spacing:-.2px;margin:0 0 2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .org-meta{font-size:12.5px;color:var(--txt-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .org-arrow{color:var(--txt-3);font-size:20px;transition:transform .2s}
  .org-card:hover .org-arrow{transform:translateX(3px);color:var(--prim)}

  /* Estado vazio / carregando */
  .empty{text-align:center;padding:50px 20px;color:var(--txt-3)}
  .empty-icon{font-size:48px;margin-bottom:12px;opacity:.6}
  .spinner{
    width:32px;height:32px;border:3px solid var(--borda);
    border-top-color:var(--prim);border-radius:50%;
    animation:spin .8s linear infinite;margin:0 auto 12px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Voltar */
  .voltar{
    display:inline-flex;align-items:center;gap:6px;
    padding:10px 14px;border-radius:10px;
    background:var(--bg-2);border:1px solid var(--borda);
    color:var(--txt);font-weight:600;font-size:14px;
    margin-bottom:18px;box-shadow:var(--sombra);
  }
  .voltar:active{background:var(--prim-cla)}
  .voltar span{font-size:18px;line-height:1}

  /* Header da org */
  .org-hdr{
    background:linear-gradient(135deg, var(--org-cor, var(--prim)), color-mix(in srgb, var(--org-cor, var(--prim)) 55%, black));
    border-radius:var(--r);padding:22px;
    color:#fff;display:flex;align-items:center;gap:16px;
    margin-bottom:20px;box-shadow:var(--sombra-forte);
    position:relative;overflow:hidden;
  }
  .org-hdr::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at top right, rgba(255,255,255,.15), transparent 60%);
    pointer-events:none;
  }
  .org-hdr-emoji{
    width:64px;height:64px;border-radius:16px;
    background:rgba(255,255,255,.2);backdrop-filter:blur(10px);
    display:grid;place-items:center;font-size:32px;flex-shrink:0;
  }
  .org-hdr-info{position:relative;z-index:1}
  .org-hdr-info h2{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.4px}
  .org-hdr-info p{margin:0;font-size:13px;opacity:.9}

  /* Section title */
  .sec-title{
    font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;
    color:var(--txt-3);margin:24px 0 12px;display:flex;align-items:center;gap:8px;
  }
  .sec-title:first-child{margin-top:0}

  /* Card de posição (equipe) */
  .pos-list{display:flex;flex-direction:column;gap:10px}
  .pos-card{
    background:var(--bg-2);border:1px solid var(--borda);border-radius:var(--r-sm);
    padding:14px 16px;display:flex;align-items:center;gap:14px;
    box-shadow:var(--sombra);
  }
  .pos-card.destaque{
    background:linear-gradient(135deg, var(--prim), var(--acen));
    color:#fff;border:none;
  }
  .pos-num{
    width:38px;height:38px;border-radius:11px;
    display:grid;place-items:center;font-weight:800;font-size:15px;
    background:var(--bg-3);color:var(--txt-2);flex-shrink:0;
  }
  .pos-card.destaque .pos-num{background:rgba(255,255,255,.25);color:#fff}
  .pos-card:nth-child(1) .pos-num{background:#fef3c7;color:#92400e}
  .pos-card:nth-child(2) .pos-num{background:#e2e8f0;color:#475569}
  .pos-card:nth-child(3) .pos-num{background:#fed7aa;color:#9a3412}
  .pos-card.destaque .pos-num{background:rgba(255,255,255,.25);color:#fff}
  .pos-info{flex:1;min-width:0}
  .pos-nome{font-weight:700;font-size:15.5px;letter-spacing:-.2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pos-meta{font-size:12px;color:var(--txt-3);margin-top:2px}
  .pos-card.destaque .pos-meta{color:rgba(255,255,255,.85)}
  .pos-pts{
    font-weight:800;font-size:19px;letter-spacing:-.5px;
    color:var(--prim);flex-shrink:0;
  }
  .pos-card.destaque .pos-pts{color:#fff}

  /* Card de jogo */
  .jogo-card{
    background:var(--bg-2);border:1px solid var(--borda);border-radius:var(--r);
    padding:16px;box-shadow:var(--sombra);margin-bottom:10px;
  }
  .jogo-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .jogo-nome{font-weight:700;font-size:16px;letter-spacing:-.2px;margin:0}
  .jogo-badge{
    font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;
    background:var(--prim-cla);color:var(--prim-esc);
  }
  .jogo-posicoes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{
    font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;
    background:var(--bg-3);color:var(--txt-2);
  }
  .jogo-resultado{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:8px 0;font-size:14px;border-top:1px dashed var(--borda);
  }
  .jogo-resultado:first-of-type{border-top:none;padding-top:0}
  .jogo-eq{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .jogo-tag{
    font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;
    background:var(--prim-cla);color:var(--prim-esc);flex-shrink:0;
  }
    /* Chaves públicas (mata-mata) */
  .fase-tag{
    display:inline-block;background:var(--prim-cla);color:var(--prim-esc);
    font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;
    margin-top:14px;margin-bottom:6px;
  }
  .chave-match{
    display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;
    margin-top:6px;padding:8px;border:1px solid var(--borda);border-radius:10px;background:var(--bg-3);
  }
  .chave-time{
    padding:10px 8px;border:2px solid var(--borda);border-radius:8px;
    background:var(--bg-2);font-size:13px;font-weight:600;
    text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .chave-time.venc{background:var(--prim);color:#fff;border-color:var(--prim-esc)}
  .chave-time.vazio{color:var(--txt-3);font-style:italic;font-weight:400}
  .chave-x{font-weight:700;color:var(--txt-3);padding:0 2px;font-size:12px}

  .jogo-tag.vazio{background:var(--bg-3);color:var(--txt-3)}

    /* Botão flutuante de tema */
  .btn-tema{
    position:fixed;
    bottom:calc(24px + env(safe-area-inset-bottom));
    left:18px;
    z-index:80;
    width:48px;height:48px;
    border-radius:50%;
    background:var(--bg-2);
    color:var(--txt);
    border:1px solid var(--borda);
    box-shadow:var(--sombra-forte);
    display:grid;place-items:center;
    font-size:22px;line-height:1;
    cursor:pointer;
    transition:transform .15s, border-color .15s;
  }
  .btn-tema:active{transform:scale(.92)}
  @media(hover:hover){ .btn-tema:hover{border-color:var(--prim)} }

  /* Toast */
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);
    background:var(--txt);color:var(--bg-2);padding:12px 20px;border-radius:12px;
    font-size:14px;font-weight:600;box-shadow:var(--sombra-forte);
    z-index:200;transition:transform .25s;max-width:90%;text-align:center;
  }
  .toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header class="hdr">
  <div class="brand">
    <div class="brand-icon">⚡</div>
    <div>
      CompAct Jr.
      <span class="brand-sub">Acompanhe os campeonatos</span>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>

<button class="btn-tema" id="btnTema" onclick="alternarTema()" title="Alternar tema">🌙</button>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   UTILITÁRIOS
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
  { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
));

/* ============================================================
   TEMA CLARO / ESCURO
   ============================================================ */
function temaEfetivo() {
  const attr = document.documentElement.getAttribute('data-tema');
  if (attr === 'dark' || attr === 'light') return attr;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function atualizarIconeTema() {
  const btn = document.getElementById('btnTema');
  if (!btn) return;
  const efetivo = temaEfetivo();
  btn.textContent = efetivo === 'dark' ? '☀️' : '🌙';
  btn.title = efetivo === 'dark' ? 'Ativar modo claro' : 'Ativar modo escuro';
}

window.alternarTema = function() {
  const novo = temaEfetivo() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-tema', novo);
  localStorage.setItem('cj_tema', novo);
  atualizarIconeTema();
};

(function initTema() {
  const salvo = localStorage.getItem('cj_tema');
  if (salvo === 'dark' || salvo === 'light') {
    document.documentElement.setAttribute('data-tema', salvo);
  }
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (!document.documentElement.getAttribute('data-tema')) atualizarIconeTema();
  });
  atualizarIconeTema();
})();

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ============================================================
   ROTEAMENTO SIMPLES POR HASH
   ============================================================ */
let rotaAtual = { tela: 'home', slug: null };

function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  const partes = h.split('/').filter(Boolean);
  if (partes[0] === 'org' && partes[1]) {
    rotaAtual = { tela: 'org', slug: decodeURIComponent(partes[1]) };
  } else {
    rotaAtual = { tela: 'home', slug: null };
  }
}

window.addEventListener('hashchange', () => {
  parseHash();
  render();
});

/* ============================================================
   API
   ============================================================ */
async function apiPublico(path) {
  const r = await fetch('/api/publico' + path);
  if (!r.ok) throw new Error('Erro ao carregar');
  return r.json();
}

/* ============================================================
   TELA: HOME
   ============================================================ */
async function renderHome() {
  const el = $('#app');
  el.innerHTML = `<div class="empty"><div class="spinner"></div>Carregando...</div>`;

  try {
    const orgs = await apiPublico('/orgs');
    if (!orgs.length) {
      el.innerHTML = `
        <div class="hero">
          <h1>Nenhum campeonato ativo</h1>
          <p>Volte mais tarde para acompanhar.</p>
        </div>`;
      return;
    }
    el.innerHTML = `
      <div class="hero">
        <h1>Escolha um campeonato</h1>
        <p>Toque para ver a classificação e os jogos.</p>
      </div>
      <div class="grid">
        ${orgs.map(o => `
          <button class="org-card" onclick="location.hash='#/org/${encodeURIComponent(o.slug)}'">
            <div class="org-emoji" style="--org-cor:${esc(o.cor || '#0ea5e9')}">
              ${esc(o.emoji || '🏆')}
            </div>
            <div class="org-info">
              <h3 class="org-nome">${esc(o.nome)}</h3>
              <div class="org-meta">
                ${o.equipes} equipe${o.equipes === 1 ? '' : 's'}
              </div>
            </div>
            <div class="org-arrow">›</div>
          </button>
        `).join('')}
      </div>`;
  } catch (e) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><p>Erro ao carregar. Tente novamente.</p></div>`;
    toast(e.message);
  }
}

/* ============================================================
   TELA: ORG
   ============================================================ */
async function renderOrg(slug) {
  const el = $('#app');
  el.innerHTML = `<div class="empty"><div class="spinner"></div>Carregando...</div>`;

  try {
    const data = await apiPublico('/orgs/' + encodeURIComponent(slug));
    const { org, equipes, jogos, competicoes } = data;
    const torneios = competicoes || [];

    // Caches
    window._equipesCache = equipes;
    window._jogosCache = {};
    jogos.forEach(j => { window._jogosCache[j.id] = j; });
    window._competicoesCache = {};
    torneios.forEach(c => { window._competicoesCache[c.id] = c; });

    // Inicializa os conjuntos de expandidos
    if (!window._jogosExpandidos || window._orgAtual !== slug) {
      window._jogosExpandidos = new Set();
      window._competicoesExpandidas = new Set();
      window._orgAtual = slug;
    }
    if (!window._competicoesExpandidas) window._competicoesExpandidas = new Set();

    el.innerHTML = `
      <button class="voltar" onclick="location.hash='#/'">
        <span>‹</span> Todos os campeonatos
      </button>

      <div class="org-hdr" style="--org-cor:${esc(org.cor || '#6366f1')}">
        <div class="org-hdr-emoji" style="overflow:hidden;color:#fff;font-weight:800">
          ${org.imagem ? `<img src="${esc(org.imagem)}" alt="" style="width:100%;height:100%;object-fit:cover">` : esc((() => {
            const partes = String(org.nome).trim().split(/\s+/).filter(Boolean);
            if (!partes.length) return '?';
            if (partes.length === 1) return partes[0].slice(0, 2).toUpperCase();
            return (partes[0][0] + partes[1][0]).toUpperCase();
          })())}
        </div>
        <div class="org-hdr-info">
          <h2>${esc(org.nome)}</h2>
          <p>${equipes.length} equipe${equipes.length === 1 ? '' : 's'} · ${jogos.length} jogo${jogos.length === 1 ? '' : 's'} · ${torneios.length} mata-mata</p>
        </div>
      </div>

      ${equipes.length ? `
        <div class="sec-title">🏅 Classificação</div>
        <div class="pos-list">
          ${equipes.map((e, i) => `
            <div class="pos-card ${i === 0 && e.total > 0 ? 'destaque' : ''}">
              <div class="pos-num">${i + 1}º</div>
              <div class="pos-info">
                <div class="pos-nome">${esc(e.nome)}</div>
                ${e.penal > 0 ? `<div class="pos-meta">−${e.penal} pts de penalidade</div>` : ''}
              </div>
              <div class="pos-pts">${e.total}</div>
            </div>
          `).join('')}
        </div>
      ` : ''}

      ${jogos.length ? `
        <div class="sec-title">🎮 Jogos</div>
        ${jogos.map(j => {
          const expandido = window._jogosExpandidos.has(j.id);
          const resultados = j.resultados || {};
          const participantes = j.participantes || [];
          const classificadas = participantes.filter(eid => resultados[eid]).length;

          return `
            <div class="jogo-card" data-jogo-id="${j.id}" style="padding:0;overflow:hidden">
              <div class="jogo-toggle"
                   onclick="toggleJogoPublico('${j.id}')"
                   style="cursor:pointer;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0">
                <div style="flex:1;min-width:0">
                  <h3 class="jogo-nome" style="margin:0">${esc(j.nome)}</h3>
                  <div style="font-size:12px;color:var(--txt-3);margin-top:3px">
                    ${classificadas} classificado${classificadas === 1 ? '' : 's'}
                  </div>
                </div>
                <span class="jogo-seta" style="font-size:22px;color:var(--txt-3);line-height:1;transition:transform .2s;flex-shrink:0;${expandido ? 'transform:rotate(90deg)' : ''}">›</span>
              </div>
              ${expandido ? `
                <div class="jogo-conteudo" style="padding:0 16px 16px 16px">
                  ${renderJogoCardInterno(j)}
                </div>
              ` : ''}
            </div>`;
        }).join('')}
      ` : ''}

      ${torneios.length ? `
        <div class="sec-title">🏆 Mata-Mata</div>
        ${torneios.map(c => {
          const expandido = window._competicoesExpandidas.has(c.id);
          const finalizada = calcularPodioPublico(c).primeiro !== '—';
          return `
            <div class="jogo-card" data-comp-id="${c.id}" style="padding:0;overflow:hidden">
              <div class="jogo-toggle"
                   onclick="toggleCompeticaoPublica('${c.id}')"
                   style="cursor:pointer;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0">
                <div style="flex:1;min-width:0">
                  <h3 class="jogo-nome" style="margin:0">
                    ${esc(c.nome)}
                    ${finalizada ? '<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#dcfce7;color:#166534;margin-left:6px">Finalizado</span>' : ''}
                  </h3>
                  <div style="font-size:12px;color:var(--txt-3);margin-top:3px">
                    🥇 ${c.pontos1} · 🥈 ${c.pontos2} · 🥉 ${c.pontos3}
                  </div>
                </div>
                <span class="jogo-seta" style="font-size:22px;color:var(--txt-3);line-height:1;transition:transform .2s;flex-shrink:0;${expandido ? 'transform:rotate(90deg)' : ''}">›</span>
              </div>
              ${expandido ? `
                <div class="jogo-conteudo" style="padding:0 16px 16px 16px">
                  ${renderChavesPublico(c)}
                </div>
              ` : ''}
            </div>`;
        }).join('')}
      ` : ''}

      ${!equipes.length && !jogos.length && !torneios.length ? `
        <div class="empty"><div class="empty-icon">📋</div><p>Nada divulgado ainda.</p></div>
      ` : ''}
    `;
  } catch (e) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><p>Campeonato não encontrado.</p></div>`;
    setTimeout(() => { location.hash = '#/'; }, 1500);
  }
}
/* Helper: renderiza o conteúdo interno do card expandido */
function renderJogoCardInterno(j) {
  const posicoes = j.posicoes || [];
  const participantes = j.participantes || [];
  const resultados = j.resultados || {};

  const classificadas = participantes
    .map(eid => {
      const eq = (window._equipesCache || []).find(e => e.id === eid);
      if (!eq) return null;
      const pid = resultados[eid];
      const p = posicoes.find(x => x.id === pid);
      return p ? { equipe: eq, posicao: p } : null;
    })
    .filter(Boolean)
    .sort((a, b) => (b.posicao.pontos || 0) - (a.posicao.pontos || 0));

  return `
    ${posicoes.length ? `
      <div class="jogo-posicoes">
        ${posicoes.map(p => `<span class="chip">${esc(p.nome)} · ${p.pontos} pts</span>`).join('')}
      </div>
    ` : ''}
    ${classificadas.length ? classificadas.map(({ equipe, posicao }) => `
      <div class="jogo-resultado">
        <span class="jogo-eq">${esc(equipe.nome)}</span>
        <span class="jogo-tag">${esc(posicao.nome)} · ${posicao.pontos} pts</span>
      </div>
    `).join('') : '<p style="color:var(--txt-3);font-size:13px;margin:8px 0 0">Nenhum resultado divulgado ainda.</p>'}
  `;
}

/* Toggle do card de jogo (versão pública) */
window.toggleJogoPublico = function(id) {
  if (!window._jogosExpandidos) window._jogosExpandidos = new Set();
  if (!window._jogosCache) window._jogosCache = {};

  const card = document.querySelector(`[data-jogo-id="${id}"]`);
  if (!card) return;

  const seta = card.querySelector('.jogo-seta');
  const conteudoExistente = card.querySelector('.jogo-conteudo');

  if (window._jogosExpandidos.has(id)) {
    // === Colapsar ===
    window._jogosExpandidos.delete(id);
    if (seta) seta.style.transform = '';
    if (conteudoExistente) conteudoExistente.remove();
  } else {
    // === Expandir ===
    window._jogosExpandidos.add(id);
    if (seta) seta.style.transform = 'rotate(90deg)';
    const jogo = window._jogosCache[id];
    if (!conteudoExistente && jogo) {
      const div = document.createElement('div');
      div.className = 'jogo-conteudo';
      div.style.padding = '0 16px 16px 16px';
      div.innerHTML = renderJogoCardInterno(jogo);
      card.appendChild(div);
    }
  }
};

/* Calcula o pódio de uma competição (versão pública) */
function calcularPodioPublico(c) {
  const partidas = c.partidas || [];
  const nome = id => {
    const eq = (window._equipesCache || []).find(e => e.id === id);
    return eq ? eq.nome : '—';
  };

  let primeiro = '—', segundo = '—', terceiro = '—';

  // 3º lugar: só partidas de mata-mata (grupo === '') marcadas como isTerceiro
  const terc = partidas.find(p => p.isTerceiro && !p.grupo && p.vencedor);
  if (terc) terceiro = nome(terc.vencedor);

  // Mata-mata (sem grupo, sem terceiro)
  const matamata = partidas.filter(p => !p.grupo && !p.isTerceiro);
  if (matamata.length) {
    // Maior rodada = final
    let final = null;
    matamata.forEach(p => {
      if (!final || (Number(p.rodada) || 0) > (Number(final.rodada) || 0)) {
        final = p;
      }
    });
    if (final && final.vencedor && final.equipeA && final.equipeB) {
      primeiro = nome(final.vencedor);
      segundo = nome(final.vencedor === final.equipeA ? final.equipeB : final.equipeA);
    }
  }

  return { primeiro, segundo, terceiro };
}

/* Renderiza as chaves de uma competição (somente leitura) */
function renderChavesPublico(c) {
  const nomeEquipe = eid => {
    const e = (window._equipesCache || []).find(x => x.id === eid);
    return e ? e.nome : '—';
  };

  const SIGLAS = {
    P: 'Partidas jogadas',
    V: 'Vitórias',
    E: 'Empates',
    D: 'Derrotas',
    GP: 'Gols Pró (marcados)',
    GC: 'Gols Contra (sofridos)',
    SG: 'Saldo de Gols',
    PTS: 'Pontos'
  };

  let html = '';

  // ============ FASE DE GRUPOS ============
  if (c.tipo === 'grupos_mata_mata' && c.grupos && c.grupos.length) {
    html += '<div style="margin-top:8px">';
    c.grupos.forEach(g => {
      // Classificação
      const classifHTML = g.classificacao.map((cls, i) => {
        const eq = (window._equipesCache || []).find(e => e.id === cls.equipeId);
        const nome = eq ? eq.nome : '—';
        const destacar = i < (c.config.classificadosPorGrupo || 2);
        return `
          <tr style="${destacar ? 'background:color-mix(in srgb, var(--prim) 10%, transparent);font-weight:700' : ''}">
            <td style="padding:8px 6px">${i + 1}º</td>
            <td style="padding:8px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px">${esc(nome)}</td>
            <td style="padding:8px 6px;text-align:center">${cls.P}</td>
            <td style="padding:8px 6px;text-align:center">${cls.V}</td>
            <td style="padding:8px 6px;text-align:center">${cls.E}</td>
            <td style="padding:8px 6px;text-align:center">${cls.D}</td>
            <td style="padding:8px 6px;text-align:center">${cls.GP}</td>
            <td style="padding:8px 6px;text-align:center">${cls.GC}</td>
            <td style="padding:8px 6px;text-align:center">${cls.SG >= 0 ? '+' : ''}${cls.SG}</td>
            <td style="padding:8px 6px;text-align:center;font-weight:800">${cls.PTS}</td>
          </tr>`;
      }).join('');

      // Partidas com placar
      const partidasHTML = g.partidas.map(p => {
        const nomeA = p.equipeA ? nomeEquipe(p.equipeA) : '—';
        const nomeB = p.equipeB ? nomeEquipe(p.equipeB) : '—';
        const gA = (p.golsA === null || p.golsA === undefined) ? '—' : p.golsA;
        const gB = (p.golsB === null || p.golsB === undefined) ? '—' : p.golsB;
        const terminou = p.golsA !== null && p.golsA !== undefined && p.golsB !== null && p.golsB !== undefined;
        let vencA = false, vencB = false;
        if (terminou) {
          if (p.golsA > p.golsB) vencA = true;
          else if (p.golsA < p.golsB) vencB = true;
        }
        return `
          <div style="display:grid;grid-template-columns:1fr 40px 20px 40px 1fr;gap:6px;align-items:center;margin-top:8px;font-size:13px">
            <div style="text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${vencA ? 'font-weight:800' : ''}">${esc(nomeA)}</div>
            <div style="text-align:center;padding:6px 4px;border-radius:6px;background:${vencA ? 'var(--prim)' : 'var(--bg-2)'};color:${vencA ? '#fff' : 'var(--txt)'};font-weight:700">${gA}</div>
            <div style="text-align:center;color:var(--txt-3);font-size:11px">×</div>
            <div style="text-align:center;padding:6px 4px;border-radius:6px;background:${vencB ? 'var(--prim)' : 'var(--bg-2)'};color:${vencB ? '#fff' : 'var(--txt)'};font-weight:700">${gB}</div>
            <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${vencB ? 'font-weight:800' : ''}">${esc(nomeB)}</div>
          </div>`;
      }).join('');

      html += `
        <div class="fase-tag" style="margin-top:16px">🌍 Grupo ${esc(g.nome)}</div>
        <div style="overflow-x:auto;margin-top:8px">
          <table style="width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px">
            <thead>
              <tr style="background:var(--bg-3);color:var(--txt-3);text-transform:uppercase;font-size:10px;letter-spacing:.5px">
                <th style="padding:8px 6px;text-align:left">#</th>
                <th style="padding:8px 6px;text-align:left">Equipe</th>
                ${Object.entries(SIGLAS).map(([s, d]) =>
                  `<th style="padding:8px 6px;cursor:help" title="${esc(d)}">${s}</th>`
                ).join('')}
              </tr>
            </thead>
            <tbody>${classifHTML}</tbody>
          </table>
        </div>
        <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:10.5px;color:var(--txt-3)">
          <span><b>P</b> Partidas</span><span><b>V</b> Vitórias</span><span><b>E</b> Empates</span>
          <span><b>D</b> Derrotas</span><span><b>GP</b> Gols Pró</span><span><b>GC</b> Gols Contra</span>
          <span><b>SG</b> Saldo</span><span><b>PTS</b> Pontos</span>
        </div>
        <div style="margin-top:14px;padding:12px;background:var(--bg-3);border-radius:10px">
          <div style="font-size:11px;font-weight:700;color:var(--txt-3);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">⚽ Placar</div>
          ${partidasHTML}
        </div>`;
    });
    html += '</div>';
  }

  // ============ MATA-MATA ============
  const todas = c.partidas || [];
  const mata = todas.filter(p => !p.grupo);
  const principais = mata.filter(p => !p.isTerceiro);
  const terceiro = mata.find(p => p.isTerceiro);

  if (principais.length) {
    const porRodada = {};
    principais.forEach(p => {
      if (!porRodada[p.rodada]) porRodada[p.rodada] = [];
      porRodada[p.rodada].push(p);
    });
    const rodadas = Object.keys(porRodada).map(Number).sort((a, b) => a - b);
    const totalRodadas = rodadas.length;

    const nomeRodada = r => {
      const faltam = totalRodadas - r;
      if (faltam === 0) return '🏆 Final';
      if (faltam === 1) return 'Semifinal';
      if (faltam === 2) return 'Quartas de Final';
      if (faltam === 3) return 'Oitavas de Final';
      return `Rodada ${r}`;
    };

    const renderMatch = m => {
      const nomeA = m.equipeA ? nomeEquipe(m.equipeA) : '—';
      const nomeB = m.equipeB ? nomeEquipe(m.equipeB) : '—';
      const vencA = m.vencedor === m.equipeA && m.equipeA;
      const vencB = m.vencedor === m.equipeB && m.equipeB;
      return `
        <div class="chave-match">
          <div class="chave-time ${vencA ? 'venc' : ''} ${!m.equipeA ? 'vazio' : ''}">${esc(nomeA)}</div>
          <span class="chave-x">×</span>
          <div class="chave-time ${vencB ? 'venc' : ''} ${!m.equipeB ? 'vazio' : ''}">${esc(nomeB)}</div>
        </div>`;
    };

    html += '<div style="margin-top:16px"></div>';
    // Fases antes da final
    for (let i = 0; i < rodadas.length - 1; i++) {
      const r = rodadas[i];
      html += `<div class="fase-tag">${esc(nomeRodada(r))}</div>`;
      porRodada[r].sort((a, b) => a.posicao - b.posicao).forEach(m => html += renderMatch(m));
    }
    // 3º lugar (antes da final)
    if (terceiro) {
      html += `<div class="fase-tag">🥉 3º Lugar</div>`;
      html += renderMatch(terceiro);
    }
    // Final (por último)
    const rFinal = rodadas[rodadas.length - 1];
    html += `<div class="fase-tag">${esc(nomeRodada(rFinal))}</div>`;
    porRodada[rFinal].sort((a, b) => a.posicao - b.posicao).forEach(m => html += renderMatch(m));
  } else if (c.tipo === 'mata_mata') {
    html += '<p style="color:var(--txt-3);font-size:13px;margin:8px 0 0">Sem chave gerada.</p>';
  }

  // ============ PÓDIO ============
  const podio = calcularPodioPublico(c);
  const temPodio = podio.primeiro !== '—' || podio.segundo !== '—' || podio.terceiro !== '—';
  if (temPodio) {
    html += `
      <div style="background:var(--bg-3);border-radius:12px;padding:14px;margin-top:16px;font-size:13.5px">
        <div style="display:flex;justify-content:space-between;padding:5px 0">
          <span style="color:#b8860b;font-weight:700">🥇 1º lugar</span>
          <span style="font-weight:700">${esc(podio.primeiro)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:5px 0">
          <span style="color:#546e7a;font-weight:700">🥈 2º lugar</span>
          <span style="font-weight:700">${esc(podio.segundo)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:5px 0">
          <span style="color:#bf360c;font-weight:700">🥉 3º lugar</span>
          <span style="font-weight:700">${esc(podio.terceiro)}</span>
        </div>
      </div>`;
  }

  return html;
}

/* Toggle do card de competição (versão pública) */
window.toggleCompeticaoPublica = function(id) {
  if (!window._competicoesExpandidas) window._competicoesExpandidas = new Set();
  if (!window._competicoesCache) window._competicoesCache = {};

  const card = document.querySelector(`[data-comp-id="${id}"]`);
  if (!card) return;

  const seta = card.querySelector('.jogo-seta');
  const conteudoExistente = card.querySelector('.jogo-conteudo');

  if (window._competicoesExpandidas.has(id)) {
    window._competicoesExpandidas.delete(id);
    if (seta) seta.style.transform = '';
    if (conteudoExistente) conteudoExistente.remove();
  } else {
    window._competicoesExpandidas.add(id);
    if (seta) seta.style.transform = 'rotate(90deg)';
    const comp = window._competicoesCache[id];
    if (!conteudoExistente && comp) {
      const div = document.createElement('div');
      div.className = 'jogo-conteudo';
      div.style.padding = '0 16px 16px 16px';
      div.innerHTML = renderChavesPublico(comp);
      card.appendChild(div);
    }
  }
};

function renderJogoCard(j) {
  const posicoes = j.posicoes || [];
  const participantes = j.participantes || [];
  const resultados = j.resultados || {};

  // Só mostra equipes que JÁ têm posição definida
  const classificadas = participantes
    .map(eid => {
      const eq = (window._equipesCache || []).find(e => e.id === eid);
      if (!eq) return null;
      const pid = resultados[eid];
      const p = posicoes.find(x => x.id === pid);
      return p ? { equipe: eq, posicao: p } : null;
    })
    .filter(Boolean)
    // ordena por pontuação (maior primeiro) para ficar coerente com o pódio
    .sort((a, b) => (b.posicao.pontos || 0) - (a.posicao.pontos || 0));

  return `
    <div class="jogo-card">
      <div class="jogo-head">
        <h3 class="jogo-nome">${esc(j.nome)}</h3>
        <span class="jogo-badge">${classificadas.length} classificado${classificadas.length === 1 ? '' : 's'}</span>
      </div>

      ${posicoes.length ? `
        <div class="jogo-posicoes">
          ${posicoes.map(p => `<span class="chip">${esc(p.nome)} · ${p.pontos} pts</span>`).join('')}
        </div>
      ` : ''}

      ${classificadas.length ? classificadas.map(({ equipe, posicao }) => `
        <div class="jogo-resultado">
          <span class="jogo-eq">${esc(equipe.nome)}</span>
          <span class="jogo-tag">${esc(posicao.nome)} · ${posicao.pontos} pts</span>
        </div>
      `).join('') : '<p style="color:var(--txt-3);font-size:13px;margin:8px 0 0">Nenhum resultado divulgado ainda.</p>'}
    </div>`;
}

/* ============================================================
   RENDER
   ============================================================ */
async function render() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (rotaAtual.tela === 'org') {
    // Cache das equipes para os cards de jogo
    try {
      const data = await apiPublico('/orgs/' + encodeURIComponent(rotaAtual.slug));
      window._equipesCache = data.equipes;
    } catch {}
    renderOrg(rotaAtual.slug);
  } else {
    renderHome();
  }
}

/* ============================================================
   INIT
   ============================================================ */
parseHash();
render();
