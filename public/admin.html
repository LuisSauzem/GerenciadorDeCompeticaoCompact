<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0ea5e9" />
<title>CompAct Jr. — Painel</title>
<!-- jsPDF + autoTable para exportação de PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{
    --prim:#6366f1; --prim-esc:#4338ca; --prim-cla:#e0e7ff;
    --acen:#f472b6;
    --ok:#22c55e; --warn:#f59e0b; --err:#ef4444;
    --bg:#f8fafc; --bg-2:#ffffff; --bg-3:#f1f5f9;
    --txt:#0f172a; --txt-2:#475569; --txt-3:#94a3b8;
    --borda:#e2e8f0;
    --sombra:0 2px 8px rgba(15,23,42,.06);
    --sombra-forte:0 8px 24px rgba(15,23,42,.12);
    --r:16px; --r-sm:10px;
  }
    /* Tema escuro: automático pelo SO, mas o usuário pode forçar claro */
  @media (prefers-color-scheme: dark){
    :root:not([data-tema="light"]){
      --bg:#0f172a; --bg-2:#1e293b; --bg-3:#0b1220;
      --txt:#f1f5f9; --txt-2:#cbd5e1; --txt-3:#94a3b8;
      --borda:#334155;
      --prim-cla:#312e81;
      --sombra:0 2px 8px rgba(0,0,0,.3);
      --sombra-forte:0 8px 24px rgba(0,0,0,.5);
    }
  }
  /* Tema escuro forçado pelo usuário */
  :root[data-tema="dark"]{
    --bg:#0f172a; --bg-2:#1e293b; --bg-3:#0b1220;
    --txt:#f1f5f9; --txt-2:#cbd5e1; --txt-3:#94a3b8;
    --borda:#334155;
    --prim-cla:#312e81;
    --sombra:0 2px 8px rgba(0,0,0,.3);
    --sombra-forte:0 8px 24px rgba(0,0,0,.5);
  }
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);min-height:100vh}
  button,input,select,textarea{font-family:inherit}
  button{cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{
    width:100%;padding:12px;border:1px solid var(--borda);border-radius:var(--r-sm);
    background:var(--bg-3);color:var(--txt);font-size:15px;margin-top:6px;
    transition:border-color .15s;
  }
    /* Remove as setinhas dos inputs numéricos (Chrome, Safari, Edge) */
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button{
    -webkit-appearance:none;
    appearance:none;
    margin:0;
  }
  /* Remove as setinhas no Firefox */
  input[type="number"]{
    -moz-appearance:textfield;
    appearance:textfield;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--prim);box-shadow:0 0 0 3px var(--prim-cla)}
  label{display:block;font-size:13px;font-weight:600;color:var(--txt-2);margin-top:14px}
  label:first-child{margin-top:0}

  /* ============ LOGIN ============ */
  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;
    background:linear-gradient(135deg,#312e81,#6366f1 55%,#a5b4fc)}
  .login-card{background:var(--bg-2);border-radius:20px;padding:36px 28px;width:100%;max-width:400px;
    box-shadow:0 24px 60px rgba(0,0,0,.35)}
  .login-logo{width:64px;height:64px;border-radius:16px;margin:0 auto 16px;
    background:linear-gradient(135deg,var(--prim),var(--acen));display:grid;place-items:center;
    color:#fff;font-size:28px;font-weight:800}
  .login-card h1{margin:0 0 6px;text-align:center;font-size:22px;letter-spacing:-.4px}
  .login-card .sub{text-align:center;color:var(--txt-3);font-size:13.5px;margin:0 0 24px}
  .btn-primario{
    width:100%;padding:14px;border-radius:12px;
    background:linear-gradient(135deg,var(--prim),var(--prim-esc));color:#fff;
    font-weight:700;font-size:15px;letter-spacing:.2px;
    box-shadow:0 4px 12px color-mix(in srgb, var(--prim) 40%, transparent);
    transition:transform .1s;margin-top:22px;
  }
  .btn-primario:active{transform:scale(.98)}
  .btn-primario:disabled{opacity:.6;cursor:not-allowed}
  .erro{background:#fee2e2;color:#b91c1c;padding:10px 12px;border-radius:10px;
    font-size:13.5px;margin-top:14px;text-align:center}
  @media (prefers-color-scheme: dark){.erro{background:#7f1d1d;color:#fecaca}}

  /* ============ APP ============ */
  .hdr{
    position:sticky;top:0;z-index:50;
    background:color-mix(in srgb, var(--bg-2) 85%, transparent);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--borda);
    padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-.3px}
  .brand-icon{width:30px;height:30px;border-radius:8px;
    background:linear-gradient(135deg,var(--prim),var(--acen));
    display:grid;place-items:center;color:#fff;font-size:15px}
  .user-chip{
    display:flex;align-items:center;gap:8px;
    background:var(--bg-3);border:1px solid var(--borda);
    border-radius:999px;padding:5px 5px 5px 12px;font-size:12.5px;font-weight:600;
  }
  .user-chip .avatar{
    width:26px;height:26px;border-radius:50%;
    background:linear-gradient(135deg,var(--prim),var(--acen));color:#fff;
    display:grid;place-items:center;font-size:12px;font-weight:800;
  }
  .user-chip button{padding:4px 10px;border-radius:999px;background:var(--err);color:#fff;font-size:11.5px;font-weight:700}

  /* Container */
  .wrap{max-width:780px;margin:0 auto;padding:18px 16px 80px}

  /* Tabs bottom */
  .tabs{
    position:fixed;bottom:0;left:0;right:0;z-index:40;
    background:color-mix(in srgb, var(--bg-2) 92%, transparent);
    backdrop-filter:blur(12px);
    border-top:1px solid var(--borda);
    display:grid;grid-template-columns:repeat(5,1fr);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    max-width:780px;margin:0 auto;
  }
  .tab{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 4px;border-radius:10px;color:var(--txt-3);
    font-size:10.5px;font-weight:600;transition:color .15s;
  }
  .tab .ico{font-size:20px;line-height:1}
  .tab.ativo{color:var(--prim)}
  .tab.ativo .ico{transform:scale(1.08)}

  /* Section */
  .sec{margin-bottom:22px}
  .sec-title{
    font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;
    color:var(--txt-3);margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .sec-title .badge{
    font-size:11px;background:var(--prim-cla);color:var(--prim-esc);
    padding:3px 9px;border-radius:999px;letter-spacing:0;
  }

  /* Cards */
  .card{
    background:var(--bg-2);border:1px solid var(--borda);border-radius:var(--r);
    padding:16px;margin-bottom:10px;box-shadow:var(--sombra);
  }
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
  .card-title{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.2px}
  .card-sub{font-size:12.5px;color:var(--txt-3);margin-top:3px}
  .card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

  /* Botões */
  .btn{
    padding:9px 14px;border-radius:10px;font-size:13.5px;font-weight:600;
    background:var(--prim);color:#fff;transition:transform .1s;white-space:nowrap;
  }
  .btn:active{transform:scale(.97)}
  .btn-ghost{background:var(--bg-3);color:var(--txt);border:1px solid var(--borda)}
  .btn-danger{background:transparent;color:var(--err);border:1px solid color-mix(in srgb,var(--err) 30%,var(--borda))}
  .btn-danger:active{background:color-mix(in srgb,var(--err) 10%,transparent)}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
  .btn-full{width:100%;padding:13px;font-size:14.5px}
  .fab{
    position:fixed;bottom:calc(78px + env(safe-area-inset-bottom));right:18px;z-index:45;
    width:56px;height:56px;border-radius:18px;
    background:linear-gradient(135deg,var(--prim),var(--prim-esc));color:#fff;
    font-size:26px;font-weight:300;line-height:1;
    box-shadow:0 8px 20px color-mix(in srgb,var(--prim) 45%, transparent);
    display:grid;place-items:center;transition:transform .12s;
  }
  .fab:active{transform:scale(.92)}
    /* Botão flutuante de tema */
  .btn-tema{
    position:fixed;
    bottom:calc(90px + env(safe-area-inset-bottom));
    left:18px;
    z-index:80;
    width:48px;height:48px;
    border-radius:50%;
    background:var(--bg-2);
    color:var(--txt);
    border:1px solid var(--borda);
    box-shadow:var(--sombra-forte);
    display:grid;place-items:center;
    font-size:22px;line-height:1;
    cursor:pointer;
    transition:transform .15s, border-color .15s;
  }
  .btn-tema:active{transform:scale(.92)}
  @media(hover:hover){ .btn-tema:hover{border-color:var(--prim)} }

  /* Tags */
  .tag{
    font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;
    background:var(--bg-3);color:var(--txt-2);display:inline-block;
  }
  .tag-prim{background:var(--prim-cla);color:var(--prim-esc)}
  .tag-ok{background:#dcfce7;color:#166534}
  .tag-warn{background:#fef3c7;color:#92400e}
  .tag-err{background:#fee2e2;color:#b91c1c}
  .tag-secreto{background:#1f2937;color:#fbbf24}
  @media (prefers-color-scheme: dark){
    .tag-ok{background:#14532d;color:#bbf7d0}
    .tag-warn{background:#78350f;color:#fde68a}
    .tag-err{background:#7f1d1d;color:#fecaca}
    .tag-secreto{background:#78350f;color:#fbbf24}
  }

  /* Empty */
  .empty{
    text-align:center;padding:40px 20px;color:var(--txt-3);
    background:var(--bg-2);border:1px dashed var(--borda);border-radius:var(--r);
  }
  .empty-icon{font-size:36px;margin-bottom:8px;opacity:.5}
  .empty p{margin:0;font-size:13.5px}

  /* ============ MODAL ============ */
  .overlay{
    position:fixed;inset:0;background:rgba(8,15,30,.65);backdrop-filter:blur(4px);
    z-index:100;display:none;align-items:flex-end;justify-content:center;padding:0;
  }
  @media(min-width:640px){.overlay{align-items:center;padding:20px}}
  .overlay.show{display:flex;animation:fade .18s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{
    background:var(--bg-2);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;
    border-radius:20px 20px 0 0;animation:slideUp .22s cubic-bezier(.2,.9,.3,1);
  }
  @media(min-width:640px){.modal{border-radius:20px}}
  @keyframes slideUp{from{transform:translateY(30px)}to{transform:translateY(0)}}
  .modal-head{
    position:sticky;top:0;z-index:2;
    background:var(--bg-2);padding:18px 20px 14px;
    border-bottom:1px solid var(--borda);
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .modal-head h2{margin:0;font-size:17px;letter-spacing:-.3px}
  .modal-x{
    width:32px;height:32px;border-radius:50%;background:var(--bg-3);
    display:grid;place-items:center;font-size:18px;color:var(--txt-2);
  }
  .modal-body{padding:20px}
  .modal-actions{display:flex;gap:8px;margin-top:22px}
  .modal-actions .btn{flex:1;padding:13px}

  /* Fieldsets */
  .fieldset{border:1px solid var(--borda);border-radius:var(--r-sm);padding:14px;margin-top:16px}
  .fieldset-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;font-weight:700;color:var(--txt-2)}
  .pos-row{display:grid;grid-template-columns:1fr 90px 34px;gap:8px;margin-top:8px;align-items:center}
  .pos-row input{margin-top:0}
  .pos-row .x{
    width:34px;height:34px;border-radius:8px;background:transparent;
    color:var(--err);border:1px solid color-mix(in srgb,var(--err) 25%,var(--borda));
    display:grid;place-items:center;font-size:16px;
  }
  .checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
  .check{
    display:flex;align-items:center;gap:8px;
    background:var(--bg-3);border:1px solid var(--borda);border-radius:10px;
    padding:10px 12px;font-size:13.5px;font-weight:500;cursor:pointer;margin:0;
  }
  .check input{width:18px;height:18px;margin:0;accent-color:var(--prim)}
  .check.marcado{border-color:var(--prim);background:var(--prim-cla)}

  /* Toggle */
  .toggle{
    display:flex;align-items:center;gap:10px;margin-top:14px;
    padding:12px;background:var(--bg-3);border:1px solid var(--borda);border-radius:10px;
    cursor:pointer;font-size:13.5px;font-weight:600;
  }
  .toggle input{width:auto;margin:0;accent-color:var(--prim);transform:scale(1.3);order:-1}
  .toggle small{display:block;font-weight:400;color:var(--txt-3);font-size:11.5px;margin-top:2px}

  /* Chaves (mata-mata) */
  .fase-tag{
    display:inline-block;background:var(--prim-cla);color:var(--prim-esc);
    font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;
    margin-top:14px;margin-bottom:6px;
  }
  .matchup{
    display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;
    margin-top:6px;padding:8px;border:1px solid var(--borda);border-radius:10px;background:var(--bg-3);
  }
  .matchup-x{font-weight:700;color:var(--txt-3);padding:0 2px;font-size:12px}
  .time-btn{
    padding:10px 8px;border:2px solid var(--borda);border-radius:8px;
    background:var(--bg-2);font-size:13px;font-weight:600;
    text-align:center;transition:.15s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .time-btn.venc{background:var(--prim);color:#fff;border-color:var(--prim-esc)}
  .time-btn.vazio{color:var(--txt-3);font-style:italic;font-weight:400}
  .time-btn:disabled{cursor:not-allowed;opacity:.85}

  /* Auditoria */
  .audit-row{
    padding:12px 14px;border-bottom:1px solid var(--borda);
    display:flex;flex-direction:column;gap:4px;
  }
  .audit-row:last-child{border-bottom:none}
  .audit-row .top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
  .audit-row .nome{font-weight:700;font-size:13.5px}
  .audit-row .quando{font-size:11.5px;color:var(--txt-3)}
  .audit-row .detalhe{font-size:12.5px;color:var(--txt-2);line-height:1.5}
  .audit-row code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:var(--bg-3);padding:2px 6px;border-radius:6px}

  /* Toast */
    /* Toast — sempre escuro e acima da barra de abas */
    /* Toast — usa opacity + visibility para esconder completamente */
  .toast{
    position:fixed;
    bottom:calc(96px + env(safe-area-inset-bottom));
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#1e293b;
    color:#f1f5f9;
    padding:12px 20px;
    border-radius:12px;
    font-size:13.5px;
    font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
    z-index:300;
    transition:opacity .25s ease, transform .25s ease, visibility 0s linear .25s;
    max-width:90%;
    text-align:center;
    border:1px solid rgba(255,255,255,.1);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  .toast.show{
    opacity:1;
    visibility:visible;
    transform:translateX(-50%) translateY(0);
    transition:opacity .25s ease, transform .25s ease, visibility 0s linear 0s;
  }
  .toast.err{
    background:#dc2626;
    color:#fff;
    border-color:rgba(255,255,255,.15);
  }

  /* Filtros */
  .filtros{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  @media(min-width:520px){.filtros{grid-template-columns:1fr 1fr 1fr 1fr}}
  .filtros input,.filtros select{margin-top:0;font-size:13px;padding:9px}

  /* Grid de estatísticas */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
  @media(min-width:520px){.stats{grid-template-columns:repeat(4,1fr)}}
  .stat{
    background:var(--bg-2);border:1px solid var(--borda);border-radius:var(--r-sm);
    padding:14px;box-shadow:var(--sombra);
  }
  .stat .rotulo{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--txt-3);font-weight:700}
  .stat .valor{font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.5px}

  /* Classificação */
  .rank-list{display:flex;flex-direction:column;gap:8px}
  .rank-item{
    display:flex;align-items:center;gap:12px;
    background:var(--bg-2);border:1px solid var(--borda);border-radius:var(--r-sm);
    padding:12px 14px;
  }
  .rank-num{
    width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    font-weight:800;font-size:13.5px;background:var(--bg-3);color:var(--txt-2);flex-shrink:0;
  }
  .rank-item:nth-child(1) .rank-num{background:#fef3c7;color:#92400e}
  .rank-item:nth-child(2) .rank-num{background:#e2e8f0;color:#475569}
  .rank-item:nth-child(3) .rank-num{background:#fed7aa;color:#9a3412}
  .rank-info{flex:1;min-width:0}
  .rank-nome{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank-meta{font-size:11.5px;color:var(--txt-3);margin-top:2px}
  .rank-pts{font-weight:800;font-size:18px;color:var(--prim);letter-spacing:-.3px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="telaLogin" class="login-wrap">
  <form class="login-card" id="formLogin">
    <div class="login-logo">⚡</div>
    <h1>CompAct Jr.</h1>
    <p class="sub">Painel de organização</p>
    <label>Usuário
      <input name="usuario" autocomplete="username" required placeholder="seu usuário" />
    </label>
    <label>Senha
      <input type="password" name="senha" autocomplete="current-password" required placeholder="••••••" />
    </label>
    <button class="btn-primario" type="submit" id="btnEntrar">Entrar</button>
    <p class="erro" id="loginErro" hidden></p>
  </form>
</div>

<!-- APP -->
<div id="app" hidden>
  <header class="hdr">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      CompAct Jr.
    </div>
    <div class="user-chip">
      <div class="avatar" id="avatarUser">?</div>
      <span id="nomeUser">—</span>
      <button id="btnSair">Sair</button>
    </div>
  </header>

  <main class="wrap" id="conteudo"></main>

  <nav class="tabs" id="tabs">
    <button class="tab ativo" data-sec="home"><span class="ico">🏠</span>Início</button>
    <button class="tab" data-sec="equipes"><span class="ico">👥</span>Equipes</button>
    <button class="tab" data-sec="jogos"><span class="ico">🎮</span>Jogos</button>
    <button class="tab" data-sec="competicoes"><span class="ico">🏆</span>Mata-Mata</button>
    <button class="tab" data-sec="mais"><span class="ico">⋯</span>Mais</button>
  </nav>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="modal-x" id="modalClose">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<!-- Botão de alternar tema -->
<button class="btn-tema" id="btnTema" onclick="alternarTema()" title="Alternar tema">🌙</button>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   UTILITÁRIOS
   ============================================================ */
/* ============================================================
   TEMA CLARO / ESCURO
   ============================================================ */
function temaEfetivo() {
  const attr = document.documentElement.getAttribute('data-tema');
  if (attr === 'dark' || attr === 'light') return attr;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function atualizarIconeTema() {
  const btn = document.getElementById('btnTema');
  if (!btn) return;
  const efetivo = temaEfetivo();
  btn.textContent = efetivo === 'dark' ? '☀️' : '🌙';
  btn.title = efetivo === 'dark' ? 'Ativar modo claro' : 'Ativar modo escuro';
}

window.alternarTema = function() {

));
const gerarId = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const fmtData = iso => {
  if (!iso) return '';
  let str = String(iso);
  // SQLite retorna "YYYY-MM-DD HH:MM:SS" em UTC (sem 'T', sem 'Z')
  // A gente converte para ISO 8601 para o JS interpretar como UTC
  if (!str.includes('T')) {
    str = str.replace(' ', 'T') + 'Z';
  }
  const d = new Date(str);
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleString('pt-BR', {
    day: '2-digit', month: '2-digit', year: '2-digit',
    hour: '2-digit', minute: '2-digit'
  });
};

/* ============================================================
   API
   ============================================================ */
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (state.token) opts.headers.Authorization = 'Bearer ' + state.token;
  if (body !== undefined) opts.body = JSON.stringify(body);

  const r = await fetch('/api' + path, opts);
  if (r.status === 401) { logout(); throw new Error('Sessão expirada'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.erro || 'Erro na requisição');
  return data;
}

const isAdmin = () => state.usuario?.papel === 'admin_geral';
const isResp  = () => state.usuario?.papel === 'responsavel';
const podeExcluir = () => isAdmin() || isResp();

async function carregarDados() {
  // Admin geral: só carrega orgs e usuários
  if (isAdmin()) {
    const [orgs, usuarios] = await Promise.all([
      api('GET', '/orgs'),
      api('GET', '/usuarios')
    ]);
    state.orgs = orgs;
    state.usuarios = usuarios;
    return;
  }

  // Responsável / organizador: carrega dados da própria org
  const [equipes, jogos, competicoes, penalidades, classificacao] = await Promise.all([
    api('GET', '/equipes'),
    api('GET', '/jogos'),
    api('GET', '/competicoes'),
    api('GET', '/penalidades'),
    api('GET', '/classificacao')
  ]);
  state.equipes = equipes;
  state.jogos = jogos;
  state.competicoes = competicoes;
  state.penalidades = penalidades;
  state.classificacao = classificacao;

  if (isResp()) {
    const [usuarios, auditoria] = await Promise.all([
      api('GET', '/usuarios'),
      api('GET', '/auditoria')
    ]);
    state.usuarios = usuarios;
    state.auditoria = auditoria;
  }
}

$('#formLogin').addEventListener('submit', async ev => {

});

  if (overlayMousedownAlvo === overlay && e.target === overlay) {

  }
  overlayMousedownAlvo = null;
});
// Suporte a toque (mobile): mesma lógica
let overlayTouchAlvo = null;

  overlayTouchAlvo = e.target;
}, { passive: true });

});document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ============================================================
   CÁLCULO DO PÓDIO DE UM JOGO (por posição)
   ------------------------------------------------------------
   Ordena as posições por pontos (desc), vê qual equipe está
   em cada uma e devolve os nomes das 3 melhores.
   ============================================================ */
function calcularPodioJogo(j) {
  const posicoes = (j.posicoes || [])
    .slice()
    .sort((a, b) => (Number(b.pontos) || 0) - (Number(a.pontos) || 0));

  const resultados = j.resultados || {};
  // Inverte: posicaoId -> equipeId
  const equipePorPosicao = {};
  Object.entries(resultados).forEach(([equipeId, posicaoId]) => {
    if (posicaoId) equipePorPosicao[posicaoId] = equipeId;
  });

  const nome = eid => {
    const eq = state.equipes.find(e => e.id === eid);
    return eq ? eq.nome : '—';
  };

  const acharNome = idx => {
    const p = posicoes[idx];
    if (!p) return '—';
    const eid = equipePorPosicao[p.id];
    return eid ? nome(eid) : '—';
  };

  return {
    primeiro: acharNome(0),
    segundo:  acharNome(1),
    terceiro: acharNome(2)
  };
}

/* ---------- JOGOS ---------- */
function jogoFinalizado(j) {
  const posicoes = j.posicoes || [];
  if (!posicoes.length) return false;
  const resultados = j.resultados || {};
  // Mapa inverso: posicaoId -> equipeId
  const equipePorPosicao = {};
  Object.entries(resultados).forEach(([equipeId, posicaoId]) => {
    if (posicaoId) equipePorPosicao[posicaoId] = equipeId;
  });
  // Todas as posições precisam ter equipe
  return posicoes.every(p => !!equipePorPosicao[p.id]);
}

/* ---------- COMPETIÇÕES (Mata-Mata) ---------- */
function renderCompeticoes(el) {

      const temResultado = podio.primeiro !== '—' || podio.segundo !== '—' || podio.terceiro !== '—';

              <div class="card-sub" style="margin-top:4px">🥇 ${c.pontos1} · 🥈 ${c.pontos2} · 🥉 ${c.pontos3}</div>
              ${c.editado_por ? `<div class="card-sub" style="margin-top:6px;font-style:italic">Última edição por ${esc(c.editado_por)}</div>` : ''}
            </div>
          </div>

          ${temResultado ? `
            <div style="margin-top:14px;padding:10px 12px;background:var(--bg-3);border-radius:10px;
                        display:flex;gap:8px;flex-wrap:wrap;align-items:center">
              ${podio.primeiro !== '—' ? pillPodio('🥇', podio.primeiro, '#fef3c7', '#92400e') : ''}
              ${podio.segundo  !== '—' ? pillPodio('🥈', podio.segundo,  '#e2e8f0', '#475569') : ''}
              ${podio.terceiro !== '—' ? pillPodio('🥉', podio.terceiro, '#fed7aa', '#9a3412') : ''}
            </div>
          ` : ''}

          <div class="card-actions" style="margin-top:14px">
            <button class="btn btn-sm" onclick="abrirChaves('${c.id}')">Ver chaves</button>
            <button class="btn btn-ghost btn-sm" onclick="editarCompeticao('${c.id}')">Editar</button>
            ${podeExcluir() && c.secreto ? `<button class="btn btn-ghost btn-sm" onclick="revelarCompeticao('${c.id}')">🔓 Revelar</button>` : ''}
            ${podeExcluir() ? `<button class="btn btn-danger btn-sm" onclick="excluirCompeticao('${c.id}')">Excluir</button>` : ''}
          </div>
        </div>`;
    }).join('') : '<div class="empty"><div class="empty-icon">🏆</div><p>Nenhuma competição criada</p></div>'}
  `;

  const fab = document.createElement('button');
  fab.className = 'fab';
  fab.textContent = '+';
  fab.onclick = () => editarCompeticao(null);
  el.appendChild(fab);
}

/* ============================================================
   CÁLCULO DE PÓDIO
   ============================================================ */
function calcularPodio(c) {
  const partidas = c.partidas || [];
  const nome = id => {
    const eq = state.equipes.find(e => e.id === id);
    return eq ? eq.nome : '—';
  };

  let primeiro = '—', segundo = '—', terceiro = '—';

  // ---- PERSONALIZADO: usa os blocos marcados como final/3º ----
    // ---- PERSONALIZADO: usa os blocos marcados como final/3º ----
  if (c.tipo === 'personalizado') {
    const blocos = c.blocos || [];
    const blocoFinal = blocos.find(b => b.ehFinal);
    const blocoTerceiro = blocos.find(b => b.ehTerceiro);

    if (blocoFinal) {
      const finais = partidas
        .filter(p => p.blocoId === blocoFinal.id && p.vencedor && p.equipeA && p.equipeB)
        .sort((a, b) => (b.posicao || 0) - (a.posicao || 0));
      const final = finais[0];
      if (final) {
        primeiro = nome(final.vencedor);
        segundo = nome(final.vencedor === final.equipeA ? final.equipeB : final.equipeA);
      }
    }
    if (blocoTerceiro) {
      const terceiros = partidas
        .filter(p => p.blocoId === blocoTerceiro.id && p.vencedor)
        .sort((a, b) => (b.posicao || 0) - (a.posicao || 0));
      const terc = terceiros[0];
      if (terc) terceiro = nome(terc.vencedor);
    }

    // ⬇️ NOVO — config.terceiroColocado tem prioridade sobre o bloco
    const cfgLocal = typeof c.config === 'string'
      ? (() => { try { return JSON.parse(c.config); } catch { return {}; } })()
      : (c.config || {});
    if (cfgLocal.terceiroColocado) {
      terceiro = nome(cfgLocal.terceiroColocado);
    }
    // ⬆️

    return { primeiro, segundo, terceiro };
  }

    // ---- Tradicional (mata-mata e grupos_mata_mata) ----
    // Prioridade: config.terceiroColocado (definido manualmente no modal)
    if (c.config?.terceiroColocado) {
      terceiro = nome(c.config.terceiroColocado);
    } else {
      const terc = partidas.find(p => p.isTerceiro && !p.grupo && p.vencedor);
      if (terc) terceiro = nome(terc.vencedor);
    }

  const matamata = partidas.filter(p => !p.grupo && !p.isTerceiro);
  if (matamata.length) {
    let final = null;
    matamata.forEach(p => {
      if (!final || (Number(p.rodada) || 0) > (Number(final.rodada) || 0)) {
        final = p;
      }
    });
    if (final && final.vencedor && final.equipeA && final.equipeB) {
      primeiro = nome(final.vencedor);
      segundo = nome(final.vencedor === final.equipeA ? final.equipeB : final.equipeA);
    }
  }

  return { primeiro, segundo, terceiro };
}

window.exportarPDF = function() {
  if (!state.classificacao.length) { toast('Sem dados para exportar', true); return; }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  const orgNome = state.usuario.orgNome || 'Classificação';
  const dataHoje = new Date().toLocaleDateString('pt-BR');

  // Cabeçalho
  doc.setFontSize(20);
  doc.setTextColor(67, 56, 202);
  doc.setFont('helvetica', 'bold');
  doc.text(orgNome, 14, 22);

  doc.setFontSize(10);
  doc.setTextColor(120, 120, 120);
  doc.setFont('helvetica', 'normal');
  doc.text('Classificação geral · ' + dataHoje, 14, 29);

  // Dados da tabela
  const body = state.classificacao.map((c, i) => [
    (i + 1) + 'º',
    c.equipe.nome,
    String(c.pontos),
    c.penal ? '-' + c.penal : '0',
    String(c.total)
  ]);

  // Renderiza a tabela
  doc.autoTable({
    startY: 36,
    head: [['#', 'Equipe', 'Pontos', 'Penal.', 'Total']],
    body: body,
    theme: 'grid',
    headStyles: {
      fillColor: [99, 102, 241],
      textColor: 255,
      fontStyle: 'bold',
      fontSize: 11
    },
    bodyStyles: {
      fontSize: 10,
      cellPadding: 4
    },
    alternateRowStyles: {
      fillColor: [248, 250, 252]
    },
    columnStyles: {
      0: { cellWidth: 16, halign: 'center' },
      1: { cellWidth: 'auto' },
      2: { cellWidth: 25, halign: 'right' },
      3: { cellWidth: 25, halign: 'right' },
      4: { cellWidth: 25, halign: 'right', fontStyle: 'bold' }
    },
    didParseCell: function(data) {
      // Destaca o pódio (1º, 2º, 3º) com cores de medalha
      if (data.section === 'body') {
        if (data.row.index === 0) data.cell.styles.fillColor = [254, 243, 199]; // ouro
        else if (data.row.index === 1) data.cell.styles.fillColor = [241, 245, 249]; // prata
        else if (data.row.index === 2) data.cell.styles.fillColor = [255, 237, 213]; // bronze
      }
      // Total negativo em vermelho
      if (data.section === 'body' && data.column.index === 4) {
        const total = Number(data.cell.raw);
        if (total < 0) {
          data.cell.styles.textColor = [239, 68, 68];
        }
      }
      // Penalidade > 0 em vermelho
      if (data.section === 'body' && data.column.index === 3) {
        if (data.cell.raw !== '0') {
          data.cell.styles.textColor = [239, 68, 68];
        }
      }
    }
  });

  // Rodapé
  const yFinal = doc.lastAutoTable.finalY + 10;
  doc.setFontSize(9);
  doc.setTextColor(150, 150, 150);
  doc.setFont('helvetica', 'italic');
  doc.text('CompAct Jr. — Gerenciador de Equipes', 105, yFinal, { align: 'center' });

  // Salva o arquivo
  const slug = orgNome.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-');
  doc.save('classificacao-' + slug + '-' + new Date().toISOString().slice(0, 10) + '.pdf');

  toast('PDF exportado!');
};

window.editarEquipe = function(id, equipePaiId = '') {
  const eq = id ? state.equipes.find(e => e.id === id) : null;

  // Se estamos criando sub-equipe, ou editando uma que já é sub
  const parentId = equipePaiId || eq?.equipePaiId || '';
  const parent = parentId ? state.equipes.find(e => e.id === parentId) : null;

  // Se editando uma equipe com filhos, não deixa mudar hierarquia
  const temFilhos = eq && state.equipes.some(e => e.equipePaiId === eq.id);

  const body = openModal(
    eq ? 'Editar equipe' : (parent ? 'Nova sub-equipe' : 'Nova equipe'),
    `
    <form id="fEq">
      ${parent ? `
        <div style="padding:10px 12px;background:var(--prim-cla);color:var(--prim-esc);
                    border-radius:10px;font-size:13px;font-weight:600;margin-bottom:10px">
          Sub-equipe de: ${esc(parent.nome)}
        </div>
      ` : ''}

      <label>Nome da equipe *
        <input name="nome" required maxlength="60" value="${esc(eq?.nome || '')}"
               placeholder="${parent ? 'Ex: 120A' : 'Ex: Turma 120'}" autofocus />
      </label>

      <label>Responsável
        <input name="responsavel" maxlength="60" value="${esc(eq?.responsavel || '')}"
               placeholder="Ex: João Silva" />
      </label>

      ${eq && !temFilhos && !eq.equipePaiId ? `
        <div style="margin-top:14px;padding:12px;background:var(--bg-3);
                    border:1px solid var(--borda);border-radius:10px;font-size:12.5px;
                    color:var(--txt-3)">
          💡 Use o botão <strong>+ Sub-equipe</strong> na lista pra criar
          variações desta equipe.
        </div>
      ` : ''}

      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn">Salvar</button>
      </div>
    </form>
  `);

  body.querySelector('#fEq').onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const dados = {
      nome: String(fd.get('nome')).trim(),
      responsavel: String(fd.get('responsavel')).trim()
    };
    if (!dados.nome) return;

    // Se é criação e tem parent
    if (!eq && parentId) {
      dados.equipePaiId = parentId;
    }

    try {
      if (eq) await api('PUT', '/equipes/' + eq.id, dados);
      else await api('POST', '/equipes', dados);
      closeModal();
      await carregarDados();
      render();
      toast(eq ? 'Equipe salva!' : (parent ? 'Sub-equipe criada!' : 'Equipe criada!'));
    } catch (e) { toast(e.message, true); }
  };
};

window.excluirEquipe = async function(id) {
  const eq = state.equipes.find(e => e.id === id);
  if (!eq || !confirm(`Excluir a equipe "${eq.nome}"?`)) return;
  try {
    await api('DELETE', '/equipes/' + id);
    await carregarDados(); render();
    toast('Equipe excluída');
  } catch (e) { toast(e.message, true); }
};

window.editarJogo = function(id) {
  const j = id ? state.jogos.find(x => x.id === id) : null;
  const posicoes = j ? j.posicoes : [
    { id: '', nome: '1º lugar', pontos: 10 },
    { id: '', nome: '2º lugar', pontos: 7 },
    { id: '', nome: '3º lugar', pontos: 5 }
  ];

  const body = openModal(j ? 'Editar jogo' : 'Novo jogo', `
    <form id="fJogo">
      <label>Nome do jogo *
        <input name="nome" required maxlength="60" value="${esc(j?.nome || '')}" placeholder="Ex: Cabo de Guerra" autofocus />
      </label>

      <label class="toggle">
        <input type="checkbox" name="secreto" ${j?.secreto ? 'checked' : ''} />
        <div>
          🔒 Jogo secreto
          <small>Não aparece na tela pública até ser revelado</small>
        </div>
      </label>

      <div class="fieldset">
        <div class="fieldset-head">
          <span>Posições e pontuação</span>
          <button type="button" class="btn btn-ghost btn-sm" id="addPos">+ adicionar</button>
        </div>
        <div id="listaPos">${posicoes.map(posRowHTML).join('')}</div>
      </div>

      <div class="fieldset">
        <div class="fieldset-head">
          <span>Equipes participantes</span>
          ${state.equipes.length ? `
            <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--txt-2);cursor:pointer;margin:0">
              <input type="checkbox" id="marcarTodas" style="width:16px;height:16px;margin:0;accent-color:var(--prim)" />
              Marcar todas
            </label>
          ` : ''}
        </div>
        ${state.equipes.length ? `
          <div class="checks">
            ${state.equipes.map(e => `
              <label class="check ${j && j.participantes.includes(e.id) ? 'marcado' : ''}">
                <input type="checkbox" value="${e.id}" ${j && j.participantes.includes(e.id) ? 'checked' : ''} />
                <span>${esc(e.nome)}</span>
              </label>
            `).join('')}
          </div>
        ` : '<p style="color:var(--txt-3);font-size:13px;margin:8px 0 0">Cadastre equipes primeiro</p>'}
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn">Salvar</button>
      </div>
    </form>
  `);

  const listaPos = body.querySelector('#listaPos');
  body.querySelector('#addPos').onclick = () => {
    listaPos.insertAdjacentHTML('beforeend', posRowHTML({ id: '', nome: '', pontos: 1 }));
  };
  listaPos.addEventListener('click', ev => {
    if (ev.target.classList.contains('rm-pos')) ev.target.closest('.pos-row').remove();
  });

  // ==== Checkboxes de equipes ====
  const checks = Array.from(body.querySelectorAll('.check input'));
  const marcarTodas = body.querySelector('#marcarTodas');

  // Atualiza a classe "marcado" ao mudar qualquer checkbox
  checks.forEach(inp => {
    inp.addEventListener('change', () => {
      inp.closest('.check').classList.toggle('marcado', inp.checked);
      // Se algum desmarcar, o "marcar todas" fica desmarcado
      if (marcarTodas) {
        marcarTodas.checked = checks.length > 0 && checks.every(c => c.checked);
      }
    });
  });

  // "Marcar todas": marca/desmarca todas de uma vez
  if (marcarTodas) {
    // Estado inicial: já marcado se todas estiverem marcadas
    marcarTodas.checked = checks.length > 0 && checks.every(c => c.checked);

    marcarTodas.addEventListener('change', () => {
      const valor = marcarTodas.checked;
      checks.forEach(c => {
        c.checked = valor;
        c.closest('.check').classList.toggle('marcado', valor);
      });
    });
  }

  body.querySelector('#fJogo').onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const posicoesNovas = $$('.pos-row', listaPos).map(r => ({
      id: r.dataset.id || gerarId(),
      nome: r.querySelector('.pos-nome').value.trim(),
      pontos: Number(r.querySelector('.pos-pts').value) || 0
    })).filter(p => p.nome);

    const participantes = $$('.check input:checked', body).map(i => i.value);

    const dados = {
      nome: String(fd.get('nome')).trim(),
      posicoes: posicoesNovas,
      participantes,
      secreto: fd.get('secreto') === 'on'
    };
    if (!dados.nome) return;

    try {
      if (j) await api('PUT', '/jogos/' + j.id, dados);
      else await api('POST', '/jogos', dados);
      closeModal();
      await carregarDados(); render();
      toast('Jogo salvo!');
    } catch (e) { toast(e.message, true); }
  };
};

window.abrirResultados = function(id) {
  const j = state.jogos.find(x => x.id === id);
  if (!j) return;
  if (!j.participantes || !j.participantes.length) {
    toast('Adicione equipes participantes antes de registrar resultados.', true);
    return;
  }

  // Constrói o mapa inverso: posicaoId -> equipeId
  // (o banco guarda o contrário: equipeId -> posicaoId)
  const equipePorPosicao = {};
  Object.entries(j.resultados || {}).forEach(([equipeId, posicaoId]) => {
    if (posicaoId) equipePorPosicao[posicaoId] = equipeId;
  });

  const body = openModal('Resultados — ' + j.nome, `
    <form id="fRes">
      <p style="margin:0 0 14px;color:var(--txt-3);font-size:13px">
        Escolha a equipe que ficou em cada posição.
        Equipes não escolhidas ganham <strong>0 pontos</strong>.
      </p>
      <div id="posicoesRes">
        ${j.posicoes.map(p => `
          <label style="font-weight:700">
            ${esc(p.nome)}
            <span style="color:var(--txt-3);font-weight:400">— ${p.pontos} pts</span>
            <select data-pos="${p.id}">
              <option value="">— Nenhuma equipe —</option>
              ${j.participantes.map(eid => {
                const eq = state.equipes.find(e => e.id === eid);
                if (!eq) return '';
                return `<option value="${eid}" ${equipePorPosicao[p.id] === eid ? 'selected' : ''}>${esc(eq.nome)}</option>`;
              }).join('')}
            </select>
          </label>
        `).join('')}
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn">Salvar resultados</button>
      </div>
    </form>
  `);

  const selects = Array.from(body.querySelectorAll('select[data-pos]'));

  // Se o usuário escolher uma equipe numa posição,
  // remove essa mesma equipe das outras posições (evita duplicidade)
  selects.forEach(sel => {
    sel.addEventListener('change', () => {
      const equipeId = sel.value;
      if (!equipeId) return;
      selects.forEach(outra => {
        if (outra !== sel && outra.value === equipeId) {
          outra.value = '';
        }
      });
    });
  });

  body.querySelector('#fRes').onsubmit = async ev => {
    ev.preventDefault();

    // Monta resultados no formato esperado pelo backend:
    // { equipeId: posicaoId }
    const res = {};
    selects.forEach(sel => {
      const posId = sel.dataset.pos;
      const equipeId = sel.value;
      if (equipeId) res[equipeId] = posId;
    });

    try {
      await api('PUT', '/jogos/' + j.id + '/resultados', { resultados: res });
      closeModal();
      await carregarDados(); render();
      toast('Resultados salvos!');
    } catch (e) { toast(e.message, true); }
  };
};

/* ============================================================
   MONTAR CHAVE MANUALMENTE
   ------------------------------------------------------------
   Abre um editor onde o admin escolhe quem enfrenta quem na
   PRIMEIRA RODADA. As fases seguintes são preenchidas
   automaticamente conforme os vencedores são definidos.

   Suporta os dois tipos de competição:
     - mata_mata:         equipes = as inscritas
     - grupos_mata_mata:  equipes = os classificados de cada grupo
                          (respeita config.classificadosPorGrupo)
   ============================================================ */
/* ============================================================
   MONTAR CHAVE MANUALMENTE (com byes)
   ------------------------------------------------------------
   Para N equipes:
     - Q = maior potência de 2 ≤ N
     - numConfrontos = N - Q  → play-in (elimina 1 por jogo)
     - numByes       = 2*Q - N → avançam direto à próxima fase

   A UI mostra:
     - Bloco "Confrontos preliminares": N-Q pares de selects
     - Bloco "Avançam direto (bye)":   2Q-N selects únicos
   Todas as equipes precisam ser alocadas em um lugar OU no outro.
   ============================================================ */
/* ============================================================
   MONTAR CHAVE MANUALMENTE (com byes)
   ------------------------------------------------------------
   Para N equipes:
     - Q = maior potência de 2 ≤ N
     - numConfrontos = N - Q  → play-in (elimina 1 por jogo)
     - numByes       = 2*Q - N → avançam direto à próxima fase

   SEMPRE renderiza exatamente numConfrontos + numByes linhas,
   independente do que já estava salvo. Só pré-preenche os valores
   quando a competição já tem uma chave montada antes.
   ============================================================ */
window.abrirMontarChave = function(id) {
  const c = state.competicoes.find(x => x.id === id);
  if (!c) return;

  // ---------- 1. Quais equipes podem entrar na chave? ----------
  let equipesPermitidas;
  if (c.tipo === 'mata_mata') {
    equipesPermitidas = state.equipes.filter(e => c.equipes.includes(e.id));
  } else {
    const qualificadosIds = [];
    const n = c.config?.classificadosPorGrupo || 2;
    (c.grupos || []).forEach(g => {
      g.classificacao.slice(0, n).forEach(cls => {
        qualificadosIds.push(cls.equipeId);
      });
    });
    equipesPermitidas = state.equipes.filter(e => qualificadosIds.includes(e.id));
  }

  const N = equipesPermitidas.length;
  if (N < 2) {
    toast('Não há equipes suficientes para montar a chave', true);
    return;
  }

  // ---------- 2. Calcula byes e confrontos ----------
  let Q = 1;
  while (Q * 2 <= N) Q *= 2;
  const numByes       = 2 * Q - N;
  const numConfrontos = N - Q;

  // ---------- 3. Lê pré-preenchimento (se houver chave antiga) ----------
  const partidasR1 = (c.partidas || [])
    .filter(p => !p.grupo && !p.isTerceiro && p.rodada === 1)
    .sort((a, b) => a.posicao - b.posicao);

  const confrontosIniciais = [];
  const byesIniciais = [];
  partidasR1.forEach(p => {
    if (p.equipeA && p.equipeB) {
      confrontosIniciais.push({ equipeA: p.equipeA, equipeB: p.equipeB });
    } else if (p.equipeA && !p.equipeB) {
      byesIniciais.push(p.equipeA);
    } else if (!p.equipeA && p.equipeB) {
      byesIniciais.push(p.equipeB);
    }
  });

  // ---------- 4. HTML ----------
  const opcoesEquipe = equipesPermitidas
    .map(e => `<option value="${e.id}">${esc(e.nome)}</option>`)
    .join('');

  // Gera EXATAMENTE numConfrontos linhas
  let linhasConfrontos = '';
  for (let i = 0; i < numConfrontos; i++) {
    linhasConfrontos += `
      <div class="fieldset" style="margin-top:10px">
        <div style="font-size:12px;color:var(--txt-3);font-weight:700;
                    text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">
          Confronto ${i + 1}
        </div>
        <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center">
          <select class="conf-a" data-idx="${i}">
            <option value="">— Equipe A —</option>
            ${opcoesEquipe}
          </select>
          <span style="font-weight:700;color:var(--txt-3)">×</span>
          <select class="conf-b" data-idx="${i}">
            <option value="">— Equipe B —</option>
            ${opcoesEquipe}
          </select>
        </div>
      </div>
    `;
  }

  // Gera EXATAMENTE numByes linhas
  let linhasByes = '';
  for (let i = 0; i < numByes; i++) {
    linhasByes += `
      <div class="fieldset" style="margin-top:10px">
        <select class="bye" data-idx="${i}">
          <option value="">— Escolha a equipe —</option>
          ${opcoesEquipe}
        </select>
      </div>
    `;
  }

  const body = openModal('Montar chave — ' + c.nome, `
    <div style="background:var(--bg-3);border-radius:10px;padding:12px;margin-bottom:14px;font-size:13px;color:var(--txt-2)">
      <strong>${N} equipes</strong> ·
      ${numConfrontos} confronto(s) preliminar(es)${numByes ? ` + ${numByes} equipe(s) com bye` : ''}
      ${numByes ? `<div style="font-size:12px;color:var(--txt-3);margin-top:4px">
        Quem ficar de bye pula a fase preliminar e entra direto na próxima.
      </div>` : ''}
    </div>

    <div style="font-size:12px;color:var(--txt-3);font-weight:700;
                text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">
      Confrontos preliminares
    </div>
    <div id="listaConfrontos">
      ${linhasConfrontos || '<p style="color:var(--txt-3);font-size:12px;margin:6px 0 0">Nenhum confronto preliminar (N é potência de 2).</p>'}
    </div>

    ${numByes > 0 ? `
      <div style="font-size:12px;color:var(--txt-3);font-weight:700;
                  text-transform:uppercase;letter-spacing:1px;margin-top:18px;margin-bottom:6px">
        Avançam direto (bye)
      </div>
      ${linhasByes}
    ` : ''}

    <div style="margin-top:16px;padding:10px 12px;background:var(--bg-3);
                border-radius:10px;font-size:12.5px;color:var(--txt-3)">
      💡 Cada equipe só pode aparecer 1 vez. Escolher num lugar remove dos outros.
    </div>

    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button type="button" class="btn" id="btnSalvarChave">Salvar chave</button>
    </div>
  `);

  // ---------- 5. Pré-seleciona valores salvos (se houver) ----------
  body.querySelectorAll('.conf-a').forEach((sel, i) => {
    if (confrontosIniciais[i]?.equipeA) sel.value = confrontosIniciais[i].equipeA;
  });
  body.querySelectorAll('.conf-b').forEach((sel, i) => {
    if (confrontosIniciais[i]?.equipeB) sel.value = confrontosIniciais[i].equipeB;
  });
  body.querySelectorAll('.bye').forEach((sel, i) => {
    if (byesIniciais[i]) sel.value = byesIniciais[i];
  });

  // ---------- 6. Anti-duplicidade ----------
  const todosSelects = Array.from(body.querySelectorAll('select'));
  todosSelects.forEach(sel => {
    sel.addEventListener('change', () => {
      const v = sel.value;
      if (!v) return;
      todosSelects.forEach(outra => {
        if (outra !== sel && outra.value === v) outra.value = '';
      });
    });
  });

  // ---------- 7. Salvar ----------
  body.querySelector('#btnSalvarChave').onclick = async () => {
    const confrontos = [];
    for (let i = 0; i < numConfrontos; i++) {
      const a = body.querySelector(`.conf-a[data-idx="${i}"]`).value;
      const b = body.querySelector(`.conf-b[data-idx="${i}"]`).value;
      if (!a || !b) { toast(`Preencha o confronto ${i + 1}`, true); return; }
      if (a === b)  { toast(`Equipe repetida no confronto ${i + 1}`, true); return; }
      confrontos.push({ equipeA: a, equipeB: b });
    }

    const byes = [];
    for (let i = 0; i < numByes; i++) {
      const b = body.querySelector(`.bye[data-idx="${i}"]`).value;
      if (!b) { toast(`Escolha a equipe com bye ${i + 1}`, true); return; }
      byes.push(b);
    }

    try {
      await api('POST', '/competicoes/' + id + '/montar-chave', { confrontos, byes });
      closeModal();
      await carregarDados();
      abrirChaves(id);
      toast('Chave montada!');
    } catch (e) {
      toast(e.message, true);
    }
  };
};

/* ============================================================
   ESCOLHER EQUIPES DO GRUPO
   ------------------------------------------------------------
   Abre um modal com checkboxes. O usuário marca quem joga no
   grupo, clica em Salvar, e o sistema gera a tabela
   todos-contra-todos automaticamente.
   ============================================================ */
window.abrirEscolherEquipesGrupo = function(id, bid) {
  const c = state.competicoes.find(x => x.id === id);
  if (!c) return;
  const b = (c.blocos || []).find(x => x.id === bid);
  if (!b) return;

  const equipes = state.equipes.filter(e => c.equipes.includes(e.id));

  // Equipes que já estão no bloco (marcadas por padrão)
  const jaNoBloco = new Set();
  (c.partidas || []).forEach(p => {
    if (p.blocoId !== bid) return;
    if (p.equipeA) jaNoBloco.add(p.equipeA);
    if (p.equipeB) jaNoBloco.add(p.equipeB);
  });

  const body = openModal('Equipes do grupo — ' + b.nome, `
    <p style="margin:0 0 12px;color:var(--txt-3);font-size:13px">
      Marque as equipes que vão jogar neste grupo. O sistema cria
      automaticamente todos os confrontos entre elas.
    </p>
    ${jaNoBloco.size ? `
      <p style="margin:0 0 12px;color:var(--warn);font-size:12.5px">
        ⚠️ Alterar as equipes vai apagar os placares já lançados neste grupo.
      </p>
    ` : ''}

    ${equipes.length ? `
      <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
                    color:var(--txt-2);cursor:pointer;margin:0 0 8px">
        <input type="checkbox" id="marcarTodasEq" style="width:16px;height:16px;margin:0;accent-color:var(--prim)" />
        Marcar todas
      </label>
      <div class="checks">
        ${equipes.map(e => `
          <label class="check ${jaNoBloco.has(e.id) ? 'marcado' : ''}">
            <input type="checkbox" value="${e.id}" ${jaNoBloco.has(e.id) ? 'checked' : ''} />
            <span>${esc(e.nome)}</span>
          </label>
        `).join('')}
      </div>
    ` : '<p style="color:var(--txt-3)">Nenhuma equipe inscrita na competição.</p>'}

    <div class="modal-actions">

  const checks = Array.from(body.querySelectorAll('.check input'));
  const marcarTodas = body.querySelector('#marcarTodasEq');

  // Marcar/desmarcar visual
  checks.forEach(inp => {
    inp.addEventListener('change', () => {
      inp.closest('.check').classList.toggle('marcado', inp.checked);
      if (marcarTodas) {
        marcarTodas.checked = checks.length > 0 && checks.every(x => x.checked);
      }
    });
  });
  if (marcarTodas) {
    marcarTodas.checked = checks.length > 0 && checks.every(x => x.checked);
    marcarTodas.addEventListener('change', () => {
      const v = marcarTodas.checked;
      checks.forEach(x => {
        x.checked = v;
        x.closest('.check').classList.toggle('marcado', v);
      });
    });
  }

  body.querySelector('#btnSalvarEquipes').onclick = async () => {
    const ids = checks.filter(x => x.checked).map(x => x.value);
    if (ids.length < 2) { toast('Selecione ao menos 2 equipes', true); return; }

    try {
      const r = await api('POST', '/competicoes/' + id + '/blocos/' + bid + '/gerar-round-robin',
        { equipeIds: ids });

      await carregarDados();
      closeModal();
      abrirEditorBlocos(id);
      toast(`${r.criados} confronto(s) criado(s)!`);
    } catch (e) { toast(e.message, true); }
  };
};

    if (c2.tipo === 'grupos_mata_mata' && !cfg.mataMataGerado) {

}

  /* ====== BLOCO: PERSONALIZADO (blocos livres) ====== */
/* ====== BLOCO: PERSONALIZADO (blocos livres) ====== */
function renderPersonalizado() {
  const c2 = state.competicoes.find(x => x.id === id);
  const blocos = (c2.blocos || []).slice().sort((a, b) => a.ordem - b.ordem);
  if (!blocos.length) {
    blocoGrupos.innerHTML = '';
    blocoMataMata.innerHTML = '<div class="empty"><p>Nenhum bloco criado ainda.</p></div>';
    return;
  }

  const partidasPorBloco = {};
  (c2.partidas || []).forEach(p => {
    if (!p.blocoId) return;
    if (!partidasPorBloco[p.blocoId]) partidasPorBloco[p.blocoId] = [];
    partidasPorBloco[p.blocoId].push(p);
  });

  const SIGLAS = {
    P: 'Partidas', V: 'Vitórias', E: 'Empates', D: 'Derrotas',
    GP: 'Gols Pró', GC: 'Gols Contra', SG: 'Saldo', PTS: 'Pontos'
  };

  let html = '';
  blocos.forEach(b => {
    const partidas = (partidasPorBloco[b.id] || []).sort((a, bb) => a.posicao - bb.posicao);
    const iconeBloco =
      b.tipo === 'grupo'      ? '🌍' :
      b.tipo === 'repescagem' ? '🔁' : '⚔️';
    html += `<div class="fase-tag" style="margin-top:22px">${iconeBloco} ${esc(b.nome)}</div>`;

    /* ==================== BLOCO TIPO GRUPO OU REPESCAGEM ==================== */
    if (b.tipo === 'grupo' || b.tipo === 'repescagem') {
      // --- Tabela de classificação ---
      const cfg = Object.assign({ pontosVitoria: 3, pontosEmpate: 1 }, b.config || {});
      const idsSet = new Set();
      partidas.forEach(p => { if (p.equipeA) idsSet.add(p.equipeA); if (p.equipeB) idsSet.add(p.equipeB); });

      const mapa = new Map();
      Array.from(idsSet).forEach(eid => mapa.set(eid, { equipeId: eid, P:0,V:0,E:0,D:0,GP:0,GC:0,SG:0,PTS:0 }));
      partidas.forEach(p => {
        if (!p.equipeA || !p.equipeB) return;
        if (p.golsA === null || p.golsB === null || p.golsA === undefined || p.golsB === undefined) return;
        const a = mapa.get(p.equipeA), bb = mapa.get(p.equipeB);
        if (!a || !bb) return;
        a.P++; bb.P++;
        a.GP += p.golsA; a.GC += p.golsB;
        bb.GP += p.golsB; bb.GC += p.golsA;
        if (p.golsA > p.golsB) { a.V++; a.PTS += cfg.pontosVitoria; bb.D++; }
        else if (p.golsA < p.golsB) { bb.V++; bb.PTS += cfg.pontosVitoria; a.D++; }
        else { a.E++; bb.E++; a.PTS += cfg.pontosEmpate; bb.PTS += cfg.pontosEmpate; }
      });
      const classif = Array.from(mapa.values()).map(x => ({ ...x, SG: x.GP - x.GC }))
        .sort((x,y) => y.PTS - x.PTS || y.SG - x.SG || y.GP - x.GP);

      const rows = classif.map((cls, i) => `
        <tr>
          <td style="padding:8px 6px">${i+1}º</td>
          <td style="padding:8px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px">${esc(nomeEquipe(cls.equipeId))}</td>
          <td style="padding:8px 6px;text-align:center">${cls.P}</td>
          <td style="padding:8px 6px;text-align:center">${cls.V}</td>
          <td style="padding:8px 6px;text-align:center">${cls.E}</td>
          <td style="padding:8px 6px;text-align:center">${cls.D}</td>
          <td style="padding:8px 6px;text-align:center">${cls.GP}</td>
          <td style="padding:8px 6px;text-align:center">${cls.GC}</td>
          <td style="padding:8px 6px;text-align:center">${cls.SG >= 0 ? '+' : ''}${cls.SG}</td>
          <td style="padding:8px 6px;text-align:center;font-weight:800">${cls.PTS}</td>
        </tr>`).join('');

      html += `
        <div style="overflow-x:auto;margin-top:8px">
          <table style="width:100%;border-collapse:collapse;font-size:13px;min-width:560px">
            <thead><tr style="background:var(--bg-3);color:var(--txt-3);text-transform:uppercase;font-size:10.5px">
              <th style="padding:8px 6px;text-align:left">#</th>
              <th style="padding:8px 6px;text-align:left">Equipe</th>
              ${Object.keys(SIGLAS).map(s => `<th style="padding:8px 6px" title="${SIGLAS[s]}">${s}</th>`).join('')}
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;

      // --- Inputs de placar (AQUI é onde estava faltando) ---
      const partidasHTML = partidas.map(p => {
        const nomeA = p.equipeA ? nomeEquipe(p.equipeA) : '—';
        const nomeB = p.equipeB ? nomeEquipe(p.equipeB) : '—';
        const gA = (p.golsA === null || p.golsA === undefined) ? '' : p.golsA;
        const gB = (p.golsB === null || p.golsB === undefined) ? '' : p.golsB;
        return `
          <div class="partida-grupo" style="display:grid;grid-template-columns:1fr 60px 20px 60px 1fr;gap:10px;align-items:center;margin-top:10px">
            <div style="text-align:right;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(nomeA)}</div>
            <input type="number" min="0" value="${gA}" data-pid="${p.id}" data-lado="a" class="placar-input"
                   style="text-align:center;padding:10px 6px;font-size:15px;font-weight:700;margin:0" />
            <div style="text-align:center;font-weight:700;color:var(--txt-3);font-size:15px">×</div>
            <input type="number" min="0" value="${gB}" data-pid="${p.id}" data-lado="b" class="placar-input"
                   style="text-align:center;padding:10px 6px;font-size:15px;font-weight:700;margin:0" />
            <div style="font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(nomeB)}</div>
          </div>`;
      }).join('');

      html += `
        <div style="margin-top:14px;padding:16px;background:var(--bg-3);border-radius:12px">
          <div style="font-size:12px;font-weight:700;color:var(--txt-3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px">⚽ Placar</div>
          <div style="font-size:12px;color:var(--txt-3);margin-bottom:4px">Lance o placar de cada partida. A tabela acima atualiza sozinha.</div>
          ${partidasHTML}
        </div>`;
    }

    /* ==================== BLOCO TIPO ELIMINATÓRIA ==================== */
    if (b.tipo === 'eliminatoria') {
      partidas.forEach(p => {
        const nomeA = p.equipeA ? nomeEquipe(p.equipeA) : '—';
        const nomeB = p.equipeB ? nomeEquipe(p.equipeB) : '—';
        const classeA = p.vencedor === p.equipeA && p.equipeA ? 'venc' : '';
        const classeB = p.vencedor === p.equipeB && p.equipeB ? 'venc' : '';
        const emptyA = !p.equipeA ? 'vazio' : '';
        const emptyB = !p.equipeB ? 'vazio' : '';
        const podeClique = !!(p.equipeA && p.equipeB) && b.tipo === 'eliminatoria';
        const disA = !podeClique ? 'disabled' : '';
        const disB = !podeClique ? 'disabled' : '';
        html += `
          <div class="matchup">
            <button class="time-btn ${classeA} ${emptyA}" data-pid="${p.id}" data-venc="${p.equipeA}" data-atual="${p.vencedor}" ${disA}>${esc(nomeA)}</button>
            <span class="matchup-x">×</span>
            <button class="time-btn ${classeB} ${emptyB}" data-pid="${p.id}" data-venc="${p.equipeB}" data-atual="${p.vencedor}" ${disB}>${esc(nomeB)}</button>
          </div>`;
      });
    }
  });

  blocoGrupos.innerHTML = '';
  blocoMataMata.innerHTML = html;

  // --- Listeners dos placares (blocos tipo grupo) ---
  blocoMataMata.querySelectorAll('.placar-input').forEach(inp => {
    inp.addEventListener('change', async () => {
      const pid = inp.dataset.pid;
      const tr = inp.closest('.partida-grupo');
      const inA = tr.querySelector('input[data-lado="a"]');
      const inB = tr.querySelector('input[data-lado="b"]');
      const golsA = inA.value === '' ? null : Number(inA.value);
      const golsB = inB.value === '' ? null : Number(inB.value);
      try {
        await api('PUT', '/competicoes/' + id + '/partidas/' + pid + '/placar', { golsA, golsB });
        await carregarDados();
        const modalBody = body.closest('.modal-body');
        const scrollAntes = modalBody ? modalBody.scrollTop : 0;
        renderPersonalizado();
        if (modalBody) modalBody.scrollTop = scrollAntes;
      } catch (e) { toast(e.message, true); }
    });
  });

  // --- Listeners dos vencedores (blocos tipo eliminatória) ---
  blocoMataMata.querySelectorAll('.time-btn').forEach(btn => {
    if (btn.disabled) return;
    btn.onclick = async () => {
      const pid = btn.dataset.pid;
      const venc = btn.dataset.venc;
      const atual = btn.dataset.atual;
      const novo = atual === venc ? '' : venc;
      try {
        await api('PUT', '/competicoes/' + id + '/partidas/' + pid + '/vencedor', { vencedor: novo });
        await carregarDados();
        renderPersonalizado();
        renderPodio();
      } catch (e) { toast(e.message, true); }
    };
  });
}

  /* ====== BLOCO: MATA-MATA ====== */
  function renderMataMata() {
    const c2 = state.competicoes.find(x => x.id === id);
    if (!c2 || !c2.partidas?.length) {
      blocoMataMata.innerHTML = '<div class="empty"><p>Sem chave gerada</p></div>';
      return;
    }

    const todas = c2.partidas.filter(p => !p.grupo);
    const principais = todas.filter(p => !p.isTerceiro);
    const terceiro = todas.find(p => p.isTerceiro);

    if (!principais.length) {
      blocoMataMata.innerHTML = '<div class="empty"><p>Mata-mata ainda não foi gerado</p></div>';
      return;
    }

    const porRodada = {};
    principais.forEach(p => {
      if (!porRodada[p.rodada]) porRodada[p.rodada] = [];
      porRodada[p.rodada].push(p);
    });
    const rodadas = Object.keys(porRodada).map(Number).sort((a, b) => a - b);
    const totalRodadas = rodadas.length;

    const nomeRodada = r => {
      const faltam = totalRodadas - r;
      if (faltam === 0) return '🏆 Final';
      if (faltam === 1) return 'Semifinal';
      if (faltam === 2) return 'Quartas de Final';
      if (faltam === 3) return 'Oitavas de Final';
      return `Rodada ${r}`;
    };

    const renderMatch = m => {
      const nomeA = m.equipeA ? nomeEquipe(m.equipeA) : '—';
      const nomeB = m.equipeB ? nomeEquipe(m.equipeB) : '—';
      const classeA = m.vencedor === m.equipeA && m.equipeA ? 'venc' : '';
      const classeB = m.vencedor === m.equipeB && m.equipeB ? 'venc' : '';
      const emptyA = !m.equipeA ? 'vazio' : '';
      const emptyB = !m.equipeB ? 'vazio' : '';
      const podeClique = !!(m.equipeA && m.equipeB);
      const disA = !podeClique ? 'disabled' : '';
      const disB = !podeClique ? 'disabled' : '';
      return `
        <div class="matchup">
          <button class="time-btn ${classeA} ${emptyA}" data-pid="${m.id}" data-venc="${m.equipeA}" data-atual="${m.vencedor}" ${disA}>${esc(nomeA)}</button>
          <span class="matchup-x">×</span>
          <button class="time-btn ${classeB} ${emptyB}" data-pid="${m.id}" data-venc="${m.equipeB}" data-atual="${m.vencedor}" ${disB}>${esc(nomeB)}</button>
        </div>`;
    };

    let html = '<div class="sec-title" style="margin-top:24px">⚔️ Mata-Mata</div>';
    for (let i = 0; i < rodadas.length - 1; i++) {
      const r = rodadas[i];
      html += `<div class="fase-tag">${esc(nomeRodada(r))}</div>`;
      porRodada[r].sort((a, b) => a.posicao - b.posicao).forEach(m => html += renderMatch(m));
    }
    if (terceiro) {
      html += `<div class="fase-tag">🥉 3º Lugar</div>`;
      html += renderMatch(terceiro);
    }
        const rFinal = rodadas[rodadas.length - 1];
    html += `<div class="fase-tag">${esc(nomeRodada(rFinal))}</div>`;
    porRodada[rFinal].sort((a, b) => a.posicao - b.posicao).forEach(m => html += renderMatch(m));

    blocoMataMata.innerHTML = html;

    blocoMataMata.innerHTML = html;

    // Listeners dos vencedores
    blocoMataMata.querySelectorAll('.time-btn').forEach(btn => {
      if (btn.disabled) return;
      btn.onclick = async () => {
        const pid = btn.dataset.pid;
        const venc = btn.dataset.venc;
        const atual = btn.dataset.atual;
        const novo = atual === venc ? '' : venc;
        try {
          await api('PUT', '/competicoes/' + id + '/partidas/' + pid + '/vencedor', { vencedor: novo });
          await carregarDados();
          renderMataMata();
          renderPodio();
        } catch (e) { toast(e.message, true); }
      };
    });
  }


  /* ====== PÓDIO ====== */
  function renderPodio() {
  const c3 = state.competicoes.find(x => x.id === id);

    podioEl.style.display = 'none';

}
  /* ====== 3º LUGAR MANUAL (aparece em TODOS os tipos) ====== */
  function renderTerceiroManual() {
    const c2 = state.competicoes.find(x => x.id === id);
    if (!c2) return;

    const cfg = c2.config || {};
    const terceiroAtual = cfg.terceiroColocado || '';

    blocoTerceiroManual.innerHTML = `

          </div>
        </label>

              ${state.equipes.map(e => `
                <option value="${e.id}" ${terceiroAtual === e.id ? 'selected' : ''}>
                  ${esc(e.nome)}

              `).join('')}
            </select>
          </label>
        </div>
      </div>
    `;

    const chk3 = blocoTerceiroManual.querySelector('#chkTerceiroChaves');
    const wrap3 = blocoTerceiroManual.querySelector('#wrapTerceiroChaves');
    const sel3 = blocoTerceiroManual.querySelector('#selTerceiroChaves');

    async function salvarTerceiro(equipeId) {
      const cFull = state.competicoes.find(x => x.id === id);
      if (!cFull) return;
      try {
        await api('PUT', '/competicoes/' + id, {
          nome: cFull.nome,
          pontos1: cFull.pontos1,
          pontos2: cFull.pontos2,
          pontos3: cFull.pontos3,
          secreto: cFull.secreto,
          terceiroColocado: equipeId
        });
        await carregarDados();
        renderPodio();
      } catch (e) { toast(e.message, true); }
    }

    if (chk3) {
      chk3.addEventListener('change', async () => {
        wrap3.style.display = chk3.checked ? 'block' : 'none';
        if (!chk3.checked) {
          await salvarTerceiro('');   // desmarcar = limpar
        } else if (sel3.value) {
          await salvarTerceiro(sel3.value);
        }
      });
    }
    if (sel3) {
      sel3.addEventListener('change', () => {
        if (chk3.checked) salvarTerceiro(sel3.value);
      });
    }
  }
  /* ====== RENDER PRINCIPAL ====== */
  function render() {
  const c2 = state.competicoes.find(x => x.id === id);
  if (c2.tipo === 'personalizado') {
    blocoGrupos.innerHTML = '';
    renderPersonalizado();
    return;
  }
  if (c2.tipo === 'grupos_mata_mata') {

    } else {

    }
  } else {
    blocoGrupos.innerHTML = '';
    renderMataMata();
  }
}

  renderAcoes();
  render();
  renderTerceiroManual();
  renderPodio();
};

      const ehFinal = card.querySelector('.bloco-final').checked;
      const ehTerceiro = card.querySelector('.bloco-terceiro').checked;
      try {
        await api('PUT', '/competicoes/' + id + '/blocos/' + bid,
          { nome, tipo, ehFinal, ehTerceiro });
        await carregarDados();
      } catch (e) { toast(e.message, true); }
    };

    card.querySelector('.bloco-nome').addEventListener('blur', salvar);
    card.querySelector('.bloco-tipo').addEventListener('change', salvar);
    card.querySelector('.bloco-final').addEventListener('change', salvar);
    card.querySelector('.bloco-terceiro').addEventListener('change', salvar);

    // Excluir bloco
    const btnExcluir = card.querySelector('.btn-excluir-bloco');
    if (btnExcluir) {
      btnExcluir.onclick = async () => {
        if (!confirm('Excluir este bloco e todos os confrontos dele?')) return;
        try {
          await api('DELETE', '/competicoes/' + id + '/blocos/' + bid);
          await recarregarEReabrir();
          toast('Bloco excluído');
        } catch (e) { toast(e.message, true); }
      };
    }

    // Botão "Escolher equipes" (bloco tipo Grupo)
    const btnEquipes = card.querySelector('.btn-escolher-equipes');
    if (btnEquipes) {
      btnEquipes.onclick = () => abrirEscolherEquipesGrupo(id, bid);
    }

    // Botão "+ Confronto" (bloco tipo Eliminatória)
    const btnAdd = card.querySelector('.btn-add-partida');
    if (btnAdd) {
      btnAdd.onclick = async () => {
        try {
          await api('POST', '/competicoes/' + id + '/blocos/' + bid + '/partidas', {});
          await recarregarEReabrir();
        } catch (e) { toast(e.message, true); }
      };
    }
        // Botão "Popular repescagem" (bloco tipo Repescagem)
    const btnPopular = card.querySelector('.btn-popular-repescagem');
    if (btnPopular) {
      btnPopular.onclick = async () => {
        if (!confirm('Puxar o 2º colocado de cada grupo e gerar os confrontos da repescagem?\n\nOs placares da repescagem serão apagados.')) return;
        try {
          const r = await api('POST', '/competicoes/' + id + '/blocos/' + bid + '/popular-repescagem', { posicao: 2 });
          await carregarDados();
          closeModal();
          abrirEditorBlocos(id);
          toast(`${r.criados} confronto(s) com ${r.equipes} equipe(s)`);
        } catch (e) { toast(e.message, true); }
      };
    }

    // Linhas de partida (blocos eliminatórios)
    card.querySelectorAll('[data-pid]').forEach(linha => {
      const pid = linha.dataset.pid;
      const selA = linha.querySelector('.part-eqA');
      const selB = linha.querySelector('.part-eqB');
      const btnX = linha.querySelector('.btn-excluir-partida');
      if (!selA || !selB || !btnX) return;

      const salvarPartida = async () => {
        const equipeA = selA.value;
        const equipeB = selB.value;
        if (equipeA && equipeB && equipeA === equipeB) {
          toast('Uma equipe não pode enfrentar a si mesma', true);
          return;
        }
        try {
          await api('PUT', '/competicoes/' + id + '/partidas/' + pid, { equipeA, equipeB });
          await carregarDados();
        } catch (e) { toast(e.message, true); }
      };

      selA.addEventListener('change', salvarPartida);
      selB.addEventListener('change', salvarPartida);

      btnX.onclick = async () => {
        try {
          await api('DELETE', '/competicoes/' + id + '/partidas/' + pid);
          await recarregarEReabrir();
        } catch (e) { toast(e.message, true); }
      };
    });
  });
};

window.editarPenalidade = function(id) {
  const p = id ? state.penalidades.find(x => x.id === id) : null;

  const body = openModal(p ? 'Editar penalidade' : 'Nova penalidade', `
    <form id="fPen">
      <label>Equipe *
        <select name="equipeId" required>
          ${state.equipes.map(e => `<option value="${e.id}" ${p && p.equipeId === e.id ? 'selected' : ''}>${esc(e.nome)}</option>`).join('')}
        </select>
      </label>
      <label>Motivo *
        <input name="motivo" required maxlength="120" value="${esc(p?.motivo || '')}" placeholder="Ex: Atraso na prova" />
      </label>
      <label>Pontos a descontar *
        <input type="number" name="pontos" min="0" required value="${p ? Math.abs(p.pontos) : 5}" />
      </label>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn">Salvar</button>
      </div>
    </form>
  `);
  body.querySelector('#fPen').onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const dados = {
      equipeId: String(fd.get('equipeId')),
      motivo: String(fd.get('motivo')).trim(),

window.excluirPenalidade = async function(id) {
  const p = state.penalidades.find(x => x.id === id);

  try {
    await api('DELETE', '/penalidades/' + id);

    if (state.secao === 'mais') abrirPenalidades();

  } catch (e) { toast(e.message, true); }
};

      </label>

      usuario: String(fd.get('usuario')).trim(),

      await carregarDados(); render();
      abrirUsuarios();
      toast('Usuário salvo!');
    } catch (e) { toast(e.message, true); }
  };
};

window.editarOrg = function(id) {
  const o = id ? state.orgs.find(x => x.id === id) : null;
  const body = openModal(o ? 'Editar organização' : 'Nova organização', `
    <form id="fOrg">
      <label>Nome *
        <input name="nome" required maxlength="60" value="${esc(o?.nome || '')}" placeholder="Ex: Medicina" autofocus />
      </label>

      <label>Cor
        <input type="color" name="cor" value="${esc(o?.cor || '#6366f1')}" style="height:46px;padding:4px" />
      </label>

      <label>Foto da organização
        <input type="file" accept="image/*" id="inputImagem" style="padding:10px;font-size:13px" />
        <input type="hidden" name="imagem" id="inputImagemBase64" value="${esc(o?.imagem || '')}" />
        <div style="font-size:11.5px;color:var(--txt-3);margin-top:4px">
          Opcional. Máx 500 KB. Se não enviar, usaremos as iniciais do nome.
        </div>
      </label>

      <div id="previewImagem" style="margin-top:10px;display:flex;align-items:center;gap:12px"></div>

      ${o ? `<label class="toggle">
        <input type="checkbox" name="ativo" ${o.ativo ? 'checked' : ''} />
        <div>Ativa</div>
      </label>` : ''}

      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn">Salvar</button>
      </div>
    </form>
  `);

  const inputFile = body.querySelector('#inputImagem');
  const inputBase64 = body.querySelector('#inputImagemBase64');
  const preview = body.querySelector('#previewImagem');
  const nomeInput = body.querySelector('input[name="nome"]');
  const corInput = body.querySelector('input[name="cor"]');

  function iniciais(nome) {
    const partes = String(nome || '').trim().split(/\s+/).filter(Boolean);
    if (!partes.length) return '?';
    if (partes.length === 1) return partes[0].slice(0, 2).toUpperCase();
    return (partes[0][0] + partes[1][0]).toUpperCase();
  }

  function atualizarPreview() {
    const val = inputBase64.value;
    const nomeAtual = nomeInput.value || '?';
    const corAtual = corInput.value || '#6366f1';

    if (val) {
      preview.innerHTML = `
        <div style="width:64px;height:64px;border-radius:14px;overflow:hidden;border:1px solid var(--borda);flex-shrink:0">
          <img src="${esc(val)}" style="width:100%;height:100%;object-fit:cover" />
        </div>
        <div style="flex:1;font-size:12.5px;color:var(--txt-3)">Foto atual</div>
        <button type="button" class="btn btn-danger btn-sm" id="btnLimparImg">Remover</button>
      `;
      preview.querySelector('#btnLimparImg').onclick = () => {
        inputFile.value = '';
        inputBase64.value = '';
        atualizarPreview();
      };
    } else {
      preview.innerHTML = `
        <div style="width:64px;height:64px;border-radius:14px;display:grid;place-items:center;
                    background:${esc(corAtual)};color:#fff;font-weight:800;font-size:22px;flex-shrink:0">
          ${esc(iniciais(nomeAtual))}
        </div>
        <div style="flex:1;font-size:12.5px;color:var(--txt-3)">
          Sem foto — será usado este selo com as iniciais
        </div>
      `;
    }
  }

  atualizarPreview();
  nomeInput.addEventListener('input', atualizarPreview);
  corInput.addEventListener('input', atualizarPreview);

  inputFile.addEventListener('change', () => {
    const file = inputFile.files[0];
    if (!file) return;
    if (file.size > 500_000) {
      toast('Imagem muito grande (máx 500 KB). Comprima antes de enviar.', true);
      inputFile.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      inputBase64.value = reader.result;
      atualizarPreview();
    };
    reader.readAsDataURL(file);
  });

  body.querySelector('#fOrg').onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const dados = {
      nome: String(fd.get('nome')).trim(),
      cor: String(fd.get('cor') || '#6366f1'),
      imagem: String(fd.get('imagem') || ''),
      ativo: fd.get('ativo') ? fd.get('ativo') === 'on' : true
    };
    if (!dados.nome) return;
    try {
      if (o) await api('PUT', '/orgs/' + o.id, dados);
      else await api('POST', '/orgs', dados);
      closeModal();
      await carregarDados(); render();
      abrirOrgs();
      toast('Organização salva!');
    } catch (e) { toast(e.message, true); }
  };
};

      return;
    }
    if (nova.length < 6) {
      toast('A nova senha deve ter ao menos 6 caracteres', true);
      return;
    }
    try {
      await api('PUT', '/me/senha', { senhaAtual: atual, senhaNova: nova });
      closeModal();
      toast('Senha alterada com sucesso!');
    } catch (e) { toast(e.message, true); }
  };
};

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
(async function init() {
  if (state.token && state.usuario) {
    try {
      const me = await api('GET', '/me');
      state.usuario = {
        ...state.usuario,
        orgMostrarSubs: me.orgMostrarSubs,
        orgNome: me.org?.nome || state.usuario.orgNome,
        orgSlug: me.org?.slug || state.usuario.orgSlug
      };
      localStorage.setItem('cj_user', JSON.stringify(state.usuario));
      await iniciarApp();
    } catch { logout(); }
  } else {
    $('#telaLogin').style.display = 'grid';
  }
})();
</script>
