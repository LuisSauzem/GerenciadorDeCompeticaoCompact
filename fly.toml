app = 'compactjrGerenciadorDePontos'
primary_region = 'gru'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpus = 1

[mounts]
  source = "compactjr_data"
  destination = "/data"

[env]
  DATA_DIR = "/data"